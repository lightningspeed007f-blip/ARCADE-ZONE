<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tap The Panda - Arcade Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070a0f; --panel:#0f1620; --line:#1f2b3a;
    --cyan:#00f0ff; --gold:#ffcf3f; --pink:#ff2d8a; --green:#8aff3c; --red:#ff4757; --muted:#8292a4;
  }
  *{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:radial-gradient(ellipse at 50% -10%,#12283a 0%,var(--bg) 60%);
    font-family:'Rajdhani',system-ui,sans-serif; color:#fff;
    display:flex; align-items:center; justify-content:center;
    padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
    overflow:hidden; touch-action:manipulation;
  }
  .wrap{width:100%;max-width:420px;}

  /* Header */
  .header-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;}
  .back-btn,.icon-btn{
    color:var(--gold); background:rgba(17,24,34,.9); border:1px solid #223040;
    border-radius:10px; font-family:'Orbitron',sans-serif; font-weight:700; cursor:pointer;
  }
  .back-btn{padding:8px 12px;text-decoration:none;font-size:11px;white-space:nowrap;}
  .icon-btn{width:36px;height:34px;font-size:15px;padding:0;}
  .icon-btn:focus-visible,.back-btn:focus-visible,.btn-start:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .ctrls{display:flex;gap:6px;}
  h1{
    font-family:'Orbitron',sans-serif; font-size:17px; margin:0; text-align:center; letter-spacing:.5px;
    background:linear-gradient(180deg,#fff,var(--cyan)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }

  /* HUD */
  .hud{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;margin-bottom:6px;}
  .hud-card{background:var(--panel);border:1.5px solid #223040;border-radius:10px;padding:7px 4px;text-align:center;}
  .hud-card small{display:block;color:var(--muted);font-size:9px;font-family:'Orbitron',sans-serif;letter-spacing:.5px;}
  .hud-card strong{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900;display:inline-block;}
  #score{color:var(--green);} #best{color:var(--gold);} #streak{color:var(--pink);}
  .bump{animation:bump .25s ease-out;}
  @keyframes bump{50%{transform:scale(1.25);}}

  .sub-hud{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;}
  .hearts{display:flex;gap:3px;}
  .hearts span{font-size:18px;transition:transform .2s,opacity .2s,filter .2s;}
  .hearts span.lost{filter:grayscale(1);opacity:.25;transform:scale(.8);}
  .mult{
    font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:var(--muted);
    border:1px solid #223040;border-radius:8px;padding:3px 8px;transition:all .2s;
  }
  .mult.on{color:#fff;background:var(--pink);border-color:var(--pink);box-shadow:0 0 14px rgba(255,45,138,.6);}
  .coins{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--gold);font-weight:900;}

  /* Arena */
  .arena{
    position:relative; width:100%; aspect-ratio:1;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:12px;
    background:linear-gradient(180deg,#111a25,#0b1119); border:2px solid var(--line); border-radius:22px;
    padding:14px; box-shadow:0 14px 40px rgba(0,0,0,.8); transition:box-shadow .3s,border-color .3s;
  }
  .arena.fire{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 45px rgba(255,45,138,.45);}
  .arena.frozen{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 45px rgba(0,240,255,.45);}
  .arena.frozen .hole{background:radial-gradient(ellipse at 50% 85%,#03070c 0%,#0b1a26 45%,#16344a 100%);}
  .arena.shake{animation:shake .35s;}
  @keyframes shake{20%{transform:translate(-6px,3px);}40%{transform:translate(6px,-3px);}60%{transform:translate(-4px,2px);}80%{transform:translate(3px,-1px);}}

  .hole{
    position:relative; border-radius:18px; overflow:hidden; cursor:pointer;
    background:radial-gradient(ellipse at 50% 85%,#03050a 0%,#0a1018 45%,#152030 100%);
    border:2px solid #1c2735; transition:border-color .15s;
  }
  .hole::after{ /* front lip of the hole */
    content:''; position:absolute; left:0; right:0; bottom:0; height:20%; z-index:2;
    background:linear-gradient(180deg,#1b2838,#0e1620); border-top:2px solid #26354a;
  }
  .critter{
    position:absolute; left:0; right:0; bottom:14%; z-index:1; text-align:center; line-height:1;
    font-size:clamp(2.2rem,12vw,3.4rem); pointer-events:none;
    transform:translateY(150%); transition:transform .17s cubic-bezier(.34,1.56,.64,1),opacity .15s;
    filter:drop-shadow(0 6px 8px rgba(0,0,0,.6));
  }
  .hole.up .critter{transform:translateY(0);}
  .hole.bonked .critter{transform:translateY(12%) scale(1.25,.6);opacity:.35;transition:transform .08s,opacity .2s;}
  .hole[data-type="gold"] .critter{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.15) drop-shadow(0 0 10px #ffcf3f);}
  .hole.up[data-type="gold"]{border-color:rgba(255,207,63,.6);}
  .hole.up[data-type="bomb"]{border-color:rgba(255,71,87,.45);}
  .hole.up[data-type="ice"]{border-color:rgba(0,240,255,.5);}
  .hole.flash{animation:flash .35s;}
  @keyframes flash{30%{background:#4a0f18;border-color:var(--red);}}

  /* Effects */
  .float{
    position:absolute; transform:translate(-50%,-50%); z-index:20; pointer-events:none; white-space:nowrap;
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:17px; text-shadow:0 2px 6px #000;
    animation:floatUp .8s ease-out forwards;
  }
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6);}20%{opacity:1;transform:translate(-50%,-60%) scale(1.15);}100%{opacity:0;transform:translate(-50%,-170%) scale(1);}}
  .p{position:absolute;width:7px;height:7px;border-radius:50%;z-index:19;pointer-events:none;animation:burst .6s ease-out forwards;}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
  .banner,.count{
    position:absolute; left:50%; top:50%; z-index:25; pointer-events:none; white-space:nowrap; text-align:center;
    font-family:'Orbitron',sans-serif; font-weight:900;
    background:linear-gradient(180deg,#fff 10%,var(--gold) 55%,var(--pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,.9));
  }
  .banner{font-size:clamp(20px,7.5vw,32px);animation:bannerPop 1.3s ease-out forwards;}
  @keyframes bannerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}25%{transform:translate(-50%,-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translate(-50%,-90%) scale(1);}}
  .count{font-size:clamp(60px,22vw,96px);animation:countPop .65s ease-out forwards;}
  @keyframes countPop{0%{opacity:0;transform:translate(-50%,-50%) scale(2);}30%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(.7);}}
  .slow-chip{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%); z-index:26;
    background:var(--cyan); color:#05121a; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900;
    padding:4px 10px; border-radius:20px; display:none;
  }
  .arena.frozen .slow-chip{display:block;}

  /* Modal */
  .modal{
    position:absolute; inset:0; z-index:30; border-radius:20px; padding:18px;
    background:rgba(8,12,17,.95); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .modal.hidden{display:none;}
  .modal h2{font-family:'Orbitron',sans-serif;font-size:24px;color:var(--gold);margin:0 0 8px;}
  .modal p{color:#cad3df;font-size:15px;line-height:1.4;margin:0 0 12px;}
  .badge{
    font-family:'Orbitron',sans-serif;font-size:12px;font-weight:900;color:#0b0f15;background:var(--gold);
    padding:5px 12px;border-radius:20px;margin-bottom:10px;animation:pulse 1s infinite;
  }
  .badge.hidden{display:none;}
  @keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 20px rgba(255,207,63,.6);}}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:280px;margin-bottom:14px;}
  .stats div{background:var(--panel);border:1px solid #223040;border-radius:10px;padding:6px;}
  .stats small{display:block;color:var(--muted);font-size:9px;font-family:'Orbitron',sans-serif;}
  .stats b{font-family:'Orbitron',sans-serif;font-size:17px;}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:14px;color:#cad3df;margin-bottom:14px;text-align:left;}
  .legend .g{filter:sepia(1) saturate(5) hue-rotate(-8deg) brightness(1.15);}
  .btn-start{
    background:var(--gold); border:none; border-radius:12px; padding:12px 28px; cursor:pointer;
    color:#0b0f15; font-family:'Orbitron',sans-serif; font-size:14px; font-weight:900;
    box-shadow:0 6px 18px rgba(255,207,63,.4);
  }
  .btn-start:active{transform:scale(.96);}
  .hint{color:var(--muted);font-size:12px;margin-top:10px;}

  @media (prefers-reduced-motion:reduce){
    .arena.shake{animation:none;} .badge{animation:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header-nav">
    <a href="index.html" class="back-btn">&larr; ARCADE</a>
    <h1>TAP THE PANDA</h1>
    <div class="ctrls">
      <button class="icon-btn" id="muteBtn" aria-label="Sound on or off">🔊</button>
      <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    </div>
  </div>

  <div class="hud">
    <div class="hud-card"><small>SCORE</small><strong id="score">0</strong></div>
    <div class="hud-card"><small>BEST</small><strong id="best">0</strong></div>
    <div class="hud-card"><small>STREAK</small><strong id="streak">0x</strong></div>
  </div>

  <div class="sub-hud">
    <div class="hearts" id="hearts"></div>
    <div class="mult" id="mult">×1</div>
    <div class="coins">🪙 <span id="coins">0</span></div>
  </div>

  <div class="arena" id="arena">
    <div class="slow-chip">❄️ SLOW-MO</div>
    <div class="modal" id="modal">
      <h2 id="mTitle">TAP THE PANDA</h2>
      <div class="badge hidden" id="mBadge">★ NEW HIGH SCORE ★</div>
      <div id="mBody"></div>
      <button class="btn-start" id="mBtn">START GAME</button>
      <div class="hint">Keyboard: Q W E / A S D / Z X C · Space to start</div>
    </div>
  </div>

</div>

<script>
/* ================= SETTINGS ================= */
const LIVES_MAX = 5;
// Upload these 4 files in the SAME folder as this HTML file:
const STREAK_SOUNDS = { 5:'streak5.mp3', 10:'streak10.mp3', 15:'streak15.mp3', 20:'streak20.mp3' };
const MILESTONE_TEXT = { 5:'NICE! 5x', 10:'ON FIRE! 2x POINTS', 15:'UNSTOPPABLE!', 20:'PANDAMONIUM! 3x' };
const EMOJI = { panda:'🐼', gold:'🐼', bomb:'💣', ice:'❄️', heart:'❤️' };
const KEYS = ['q','w','e','a','s','d','z','x','c'];

/* ================= SETUP ================= */
const $ = id => document.getElementById(id);
const arena = $('arena'), modal = $('modal');
const holes = [];
for (let i = 0; i < 9; i++) {
  const h = document.createElement('div');
  h.className = 'hole';
  h.innerHTML = '<span class="critter">🐼</span>';
  arena.insertBefore(h, modal);
  holes.push(h);
}
const state = holes.map(() => ({ type:null, hit:false, timer:null }));
for (let i = 0; i < LIVES_MAX; i++) { const s = document.createElement('span'); s.textContent = '❤️'; $('hearts').appendChild(s); }

const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let best = store.get('tp_best', 0);
let bestStreak = store.get('tp_bestStreak', 0);
let muted = store.get('tp_muted', false);

let score=0, streak=0, bestRun=0, coins=0, lives=LIVES_MAX, hits=0;
let running=false, paused=false, counting=false, newBestShown=false;
let spawnTimer=null, slowTimer=null, cdTimer=null, slowUntil=0, lastHole=-1;
let modalAction = startGame;

/* ================= AUDIO ================= */
let ctx = null;
function ac(){
  if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ctx && ctx.state === 'suspended') ctx.resume();
  return ctx;
}
function tone(f, d=0.1, type='square', vol=0.15, to=null, delay=0){
  if (muted) return;
  const c = ac(); if (!c) return;
  const t = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  hit:  () => { const s = Math.min(streak, 25); tone(420 + s*25, 0.09, 'square', 0.12, 900 + s*30); },
  gold: () => [880,1175,1568].forEach((f,i) => tone(f, 0.12, 'triangle', 0.15, null, i*0.06)),
  bomb: () => tone(180, 0.35, 'sawtooth', 0.25, 40),
  miss: () => tone(300, 0.2, 'triangle', 0.15, 120),
  ice:  () => [1400,1800,2200].forEach((f,i) => tone(f, 0.15, 'sine', 0.1, null, i*0.05)),
  heart:() => [660,880].forEach((f,i) => tone(f, 0.12, 'triangle', 0.15, null, i*0.08)),
  beep: hi => tone(hi ? 1046 : 523, 0.15, 'square', 0.12),
  over: () => [392,330,262].forEach((f,i) => tone(f, 0.25, 'triangle', 0.15, null, i*0.18)),
  fanfare: n => { const notes = [523,659,784,1046,1318]; for (let i=0; i<=Math.min(4, n/5); i++) tone(notes[i], 0.14, 'square', 0.12, null, i*0.08); }
};
// Your uploaded streak audios (falls back to built-in sound if a file is missing)
const voice = {};
for (const k in STREAK_SOUNDS) {
  const a = new Audio(STREAK_SOUNDS[k]);
  a.preload = 'auto';
  a.addEventListener('error', () => { a._bad = true; });
  voice[k] = a;
}
function playMilestone(n){
  if (muted) return;
  const a = voice[n];
  if (!a || a._bad) { sfx.fanfare(n); return; }
  try { a.currentTime = 0; const p = a.play(); if (p) p.catch(() => sfx.fanfare(n)); }
  catch(e){ sfx.fanfare(n); }
}

/* ================= DIFFICULTY ================= */
const slowF     = () => performance.now() < slowUntil ? 1.7 : 1;
const diff      = () => Math.min(1, hits / 90);
const mult      = () => streak >= 20 ? 3 : streak >= 10 ? 2 : 1;
const spawnDelay= () => Math.max(260, 900 - diff()*520 - Math.min(streak,25)*6) * slowF();
const upTime    = () => Math.max(560, 1350 - diff()*620 - Math.min(streak,25)*10) * slowF();
const maxActive = () => 1 + (hits >= 12 ? 1 : 0) + (hits >= 40 ? 1 : 0);

function pickType(){
  if (hits < 4) return 'panda';
  const r = Math.random(); let c = 0;
  if (r < (c += 0.10 + diff()*0.10)) return 'bomb';
  if (r < (c += 0.07)) return 'gold';
  if (r < (c += 0.03) && performance.now() > slowUntil) return 'ice';
  if (r < (c += 0.025) && lives < LIVES_MAX) return 'heart';
  return 'panda';
}

/* ================= GAME LOOP ================= */
function spawn(){
  if (!running || paused) return;
  const active = state.filter(s => s.type).length;
  if (active < maxActive()) {
    const free = state.map((s,i) => (!s.type && i !== lastHole) ? i : -1).filter(i => i >= 0);
    if (free.length) { const i = free[Math.random()*free.length | 0]; lastHole = i; show(i, pickType()); }
  }
  spawnTimer = setTimeout(spawn, spawnDelay());
}

function show(i, type){
  const s = state[i], h = holes[i];
  s.type = type; s.hit = false;
  h.dataset.type = type;
  h.querySelector('.critter').textContent = EMOJI[type];
  h.classList.remove('bonked'); void h.offsetWidth; h.classList.add('up');
  let t = upTime();
  if (type === 'gold') t *= 0.7;
  if (type === 'bomb') t *= 1.15;
  if (type === 'ice' || type === 'heart') t *= 0.85;
  s.timer = setTimeout(() => escape(i), t);
}

function escape(i){
  const s = state[i];
  if (!s.type || s.hit) return;
  const wasPanda = s.type === 'panda';
  clearHole(i);
  if (wasPanda && running) { sfx.miss(); loseLife(i, 'MISS'); }
}

function clearHole(i, delay=0){
  const s = state[i], h = holes[i];
  clearTimeout(s.timer);
  const done = () => { h.classList.remove('up','bonked'); s.type = null; s.hit = false; h.dataset.type = ''; };
  if (delay) s.timer = setTimeout(done, delay); else done();
}

function resetHoles(){
  state.forEach((s,i) => { clearTimeout(s.timer); s.type = null; s.hit = false; holes[i].classList.remove('up','bonked','flash'); holes[i].dataset.type = ''; });
}

function tap(i){
  if (!running || paused) return;
  const s = state[i];
  if (!s.type || s.hit) return;
  s.hit = true; clearTimeout(s.timer);
  holes[i].classList.add('bonked');
  const { x, y } = center(i);

  switch (s.type) {
    case 'panda': {
      streakUp(); const pts = (10 + streak*2) * mult();
      score += pts; coins += 1; hits++;
      floatText(x, y, '+' + pts, mult() > 1 ? 'var(--pink)' : 'var(--green)');
      burst(x, y, '#ffffff', 8); sfx.hit(); buzz(12); break;
    }
    case 'gold': {
      streakUp(); const pts = 50 * mult();
      score += pts; coins += 5; hits++;
      floatText(x, y, '+' + pts + ' ⭐', 'var(--gold)');
      burst(x, y, '#ffcf3f', 16); sfx.gold(); buzz([15,30,15]); break;
    }
    case 'bomb':
      burst(x, y, '#ff4757', 18); sfx.bomb(); shake(); loseLife(i, 'BOOM!'); break;
    case 'ice':
      freeze(); floatText(x, y, 'SLOW-MO', 'var(--cyan)'); burst(x, y, '#00f0ff', 14); sfx.ice(); break;
    case 'heart':
      lives = Math.min(LIVES_MAX, lives + 1); floatText(x, y, '+1 ❤️', '#ff6b8a'); burst(x, y, '#ff6b8a', 12); sfx.heart(); break;
  }

  if (running && best > 0 && score > best && !newBestShown) { newBestShown = true; banner('NEW BEST!'); }
  hud();
  clearHole(i, 200);
}

function streakUp(){
  streak++;
  if (streak > bestRun) bestRun = streak;
  if (MILESTONE_TEXT[streak]) { playMilestone(streak); banner(MILESTONE_TEXT[streak]); }
  else if (streak > 20 && streak % 10 === 0) { playMilestone(20); banner(streak + 'x COMBO!'); }
  arena.classList.toggle('fire', streak >= 10);
  bump('streak');
}

function loseLife(i, label){
  lives--; streak = 0;
  arena.classList.remove('fire');
  const { x, y } = center(i);
  floatText(x, y, label, 'var(--red)');
  holes[i].classList.remove('flash'); void holes[i].offsetWidth; holes[i].classList.add('flash');
  buzz(120); hud();
  if (lives <= 0) endGame();
}

function freeze(){
  slowUntil = performance.now() + 5000;
  arena.classList.add('frozen');
  clearTimeout(slowTimer);
  slowTimer = setTimeout(() => arena.classList.remove('frozen'), 5000);
}

/* ================= EFFECTS ================= */
function center(i){ const h = holes[i]; return { x: h.offsetLeft + h.offsetWidth/2, y: h.offsetTop + h.offsetHeight/3 }; }
function floatText(x, y, text, color){
  const d = document.createElement('div');
  d.className = 'float'; d.textContent = text;
  d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.color = color;
  arena.appendChild(d); d.addEventListener('animationend', () => d.remove());
}
function burst(x, y, color, n){
  for (let k = 0; k < n; k++) {
    const p = document.createElement('i');
    const a = Math.random()*Math.PI*2, r = 30 + Math.random()*45;
    p.className = 'p';
    p.style.cssText = `left:${x}px;top:${y}px;background:${color};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px`;
    arena.appendChild(p); p.addEventListener('animationend', () => p.remove());
  }
}
function banner(text){
  const old = arena.querySelector('.banner'); if (old) old.remove();
  const b = document.createElement('div'); b.className = 'banner'; b.textContent = text;
  arena.appendChild(b); b.addEventListener('animationend', () => b.remove());
}
function shake(){ arena.classList.remove('shake'); void arena.offsetWidth; arena.classList.add('shake'); }
function buzz(p){ if (navigator.vibrate) { try { navigator.vibrate(p); } catch(e){} } }
function bump(id){ const el = $(id); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function hud(){
  if ($('score').textContent !== String(score)) bump('score');
  $('score').textContent = score;
  $('best').textContent = Math.max(best, score);
  $('streak').textContent = streak + 'x';
  $('coins').textContent = coins;
  $('mult').textContent = '×' + mult();
  $('mult').classList.toggle('on', mult() > 1);
  [...$('hearts').children].forEach((h,k) => h.classList.toggle('lost', k >= lives));
}

/* ================= SCREENS ================= */
function showModal(title, body, btn, action, newBest=false){
  $('mTitle').textContent = title;
  $('mBody').innerHTML = body;
  $('mBtn').textContent = btn;
  $('mBadge').classList.toggle('hidden', !newBest);
  modalAction = action;
  modal.classList.remove('hidden');
  $('mBtn').focus({ preventScroll:true });
}
function hideModal(){ modal.classList.add('hidden'); }

function startScreen(){
  showModal('TAP THE PANDA',
    `<p>Tap pandas before they hide. Miss 5 and it's over.<br>Build streaks for bonus points.</p>
     <div class="legend">
       <span>🐼 +10 points</span><span><span class="g">🐼</span> +50, 5 coins</span>
       <span>💣 don't tap!</span><span>❄️ slow motion</span>
       <span>❤️ extra life</span><span>🔥 10x = 2× pts</span>
     </div>
     <p>Best: <b style="color:var(--gold)">${best}</b> · Top streak: <b style="color:var(--pink)">${bestStreak}x</b></p>`,
    'START GAME', startGame);
}

function startGame(){
  ac(); hideModal();
  clearTimeout(spawnTimer); clearTimeout(cdTimer); clearTimeout(slowTimer);
  score = 0; streak = 0; bestRun = 0; coins = 0; lives = LIVES_MAX; hits = 0;
  slowUntil = 0; lastHole = -1; newBestShown = false; running = false; paused = false;
  arena.classList.remove('fire','frozen');
  resetHoles(); hud();
  countdown(3);
}

function countdown(n){
  counting = true;
  const c = document.createElement('div'); c.className = 'count';
  c.textContent = n === 0 ? 'GO!' : n;
  arena.appendChild(c); c.addEventListener('animationend', () => c.remove());
  sfx.beep(n === 0);
  if (n === 0) { counting = false; running = true; paused = false; spawnTimer = setTimeout(spawn, 350); return; }
  cdTimer = setTimeout(() => countdown(n - 1), 650);
}

function pauseGame(){
  if (!running || paused) return;
  paused = true; clearTimeout(spawnTimer); resetHoles();
  showModal('PAUSED', `<p>Score: <b>${score}</b> · Streak: <b>${streak}x</b></p>`, 'RESUME', resumeGame);
}
function resumeGame(){
  hideModal(); paused = false; ac();
  spawnTimer = setTimeout(spawn, 600);
}

function endGame(){
  running = false; paused = false;
  clearTimeout(spawnTimer); clearTimeout(slowTimer);
  resetHoles(); arena.classList.remove('fire','frozen');
  sfx.over(); buzz([80,60,80]);

  const isNew = score > best && score > 0;
  if (isNew) { best = score; store.set('tp_best', best); }
  if (bestRun > bestStreak) { bestStreak = bestRun; store.set('tp_bestStreak', bestStreak); }

  showModal('GAME OVER',
    `<div class="stats">
       <div><small>SCORE</small><b style="color:var(--green)">${score}</b></div>
       <div><small>BEST</small><b style="color:var(--gold)">${best}</b></div>
       <div><small>TOP STREAK</small><b style="color:var(--pink)">${bestRun}x</b></div>
       <div><small>COINS</small><b style="color:var(--gold)">${coins}</b></div>
     </div>
     <p>All-time top streak: <b>${bestStreak}x</b></p>`,
    'PLAY AGAIN', startGame, isNew);
  hud();
}

/* ================= INPUT ================= */
holes.forEach((h,i) => h.addEventListener('pointerdown', e => { e.preventDefault(); tap(i); }));
$('mBtn').addEventListener('click', () => modalAction());
$('pauseBtn').addEventListener('click', () => paused ? resumeGame() : pauseGame());
$('muteBtn').addEventListener('click', () => {
  muted = !muted; store.set('tp_muted', muted);
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
});
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const idx = KEYS.indexOf(k);
  if (idx >= 0) { tap(idx); return; }
  if ((k === ' ' || k === 'enter') && !modal.classList.contains('hidden')) { e.preventDefault(); modalAction(); }
  if (k === 'p' || k === 'escape') { paused ? resumeGame() : pauseGame(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

/* ================= INIT ================= */
$('muteBtn').textContent = muted ? '🔇' : '🔊';
hud();
startScreen();
</script>
</body>
</html>
