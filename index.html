<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Arcade Zone - Game Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%; height: 100%;
  background: #05060a;
  color: #eef4f8;
  font-family: 'Rajdhani', 'Segoe UI', sans-serif;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
}

/* ===== Background video (same setup as spin.html) ===== */
#bgVideo {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
  pointer-events: none;
}
#bgShade {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse at center, rgba(5,6,10,0.25) 0%, rgba(5,6,10,0.8) 90%);
}
#videoMsg {
  position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: none;
  background: rgba(255,60,80,0.9); color: #fff;
  font-size: 13px; padding: 6px 12px; border-radius: 8px;
}

/* ===== Page layout ===== */
.app {
  position: fixed; top: 0; left: 0; width: 100%;
  height: 100%;
  z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 16px 18px;
  transition: opacity 0.3s ease;
}
body.leaving .app { opacity: 0; }

header { text-align: center; flex-shrink: 0; }
header h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 900;
  font-size: 30px; letter-spacing: 4px;
  background: linear-gradient(90deg, #00f0ff, #ff2d8a);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
header p { color: #b4bdd6; font-size: 15px; margin-top: 2px; }

/* ===== Swipe area with the 3D cylinder ===== */
.stage {
  flex: 1 1 auto;
  width: 100%;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  -webkit-perspective: 1000px; perspective: 1000px;
  touch-action: none;          /* finger swipes go to the carousel */
  cursor: grab;
  overflow: visible;
}
.ring {
  position: relative;
  -webkit-transform-style: preserve-3d; transform-style: preserve-3d;
  transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.ring.dragging { transition: none; }

.card {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  border-radius: 22px;
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 14px 10px;
  -webkit-backface-visibility: hidden; backface-visibility: hidden;
  transition: opacity 0.4s, box-shadow 0.4s;
  opacity: 0.45;
}
.card.active { opacity: 1; }
.card .icon { font-size: calc(var(--cw) * 0.36); line-height: 1.1; }
.card.active .icon { animation: bob 2.2s ease-in-out infinite alternate; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-7px); } }
.card .name {
  font-family: 'Orbitron', sans-serif; font-weight: 700;
  font-size: calc(var(--cw) * 0.088); line-height: 1.25;
  margin-top: 10px;
}
.card .tag {
  margin-top: 8px;
  font-size: calc(var(--cw) * 0.072); font-weight: 700;
  padding: 2px 12px; border-radius: 30px; border: 1px solid;
}

/* ===== Bottom: selected game + play ===== */
.bottom {
  flex-shrink: 0;
  width: 100%; max-width: 420px;
  text-align: center;
}
.dots { display: flex; justify-content: center; gap: 7px; margin-bottom: 12px; }
.dots span {
  width: 7px; height: 7px; border-radius: 10px;
  background: rgba(255,255,255,0.3);
  transition: width 0.3s, background 0.3s;
}
.dots span.on { width: 22px; }
.bottom h2 {
  font-family: 'Orbitron', sans-serif; font-size: 19px; font-weight: 700;
  transition: color 0.3s;
}
.bottom .desc {
  color: #d0d7ea; font-size: 15px; line-height: 1.35;
  margin: 4px 0 14px; min-height: 40px;
}
.play {
  display: block; width: 100%;
  padding: 15px 10px;
  border: none; border-radius: 16px; cursor: pointer;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; letter-spacing: 2px;
  color: #fff;
  background: linear-gradient(90deg, #ff2d8a, #7f3cff);
  box-shadow: 0 8px 22px rgba(255,45,138,0.45);
}
.play:active { transform: scale(0.97); }
footer { margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.4); }

@media (min-height: 760px) { header h1 { font-size: 36px; } }
</style>
</head>
<body>

<!-- Background video: the same bg.mp4 that spin.html plays -->
<video id="bgVideo" autoplay muted loop playsinline webkit-playsinline>
  <source id="bgSource" src="bg.mp4" type="video/mp4">
</video>
<div id="bgShade"></div>
<div id="videoMsg">bg.mp4 not found next to index.html</div>

<div class="app">
  <header>
    <h1>ARCADE ZONE</h1>
    <p>Swipe to choose a game</p>
  </header>

  <div class="stage" id="stage">
    <div class="ring" id="ring"></div>
  </div>

  <div class="bottom">
    <div class="dots" id="dots"></div>
    <h2 id="gameName"></h2>
    <p class="desc" id="gameDesc"></p>
    <button class="play" id="playBtn">PLAY</button>
    <footer>✨ Maa Kamakhya Group ✨</footer>
  </div>
</div>

<script>
/* ========= GAME LIST: add a new game by adding one line ========= */
var GAMES = [
  { href: "horror.html",       icon: "👻", name: "The Last Night", tag: "Horror", color: "#b46bff",
    desc: "Survive the haunted estate and find the secret key." },
  { href: "jais_express.html", icon: "🛺", name: "Jais Express",   tag: "Racing", color: "#ffcf3f",
    desc: "Drive your auto through Jais. Dodge traffic, grab coins." },
  { href: "spin.html",         icon: "🎯", name: "Spin The Wheel", tag: "Luck",   color: "#00f0ff",
    desc: "Spin and try your luck to win teddy bears and toffees." },
  { href: "panda.html",        icon: "🐼", name: "Tap The Panda",  tag: "Reflex", color: "#8aff3c",
    desc: "Tap the panda fast. It speeds up as you score." },
  { href: "dharma.html",       icon: "🏹", name: "Dharma Quiz",    tag: "Quiz",   color: "#ff7a1a",
    desc: "धर्म प्रश्नोत्तरी — 150 questions with 3 lifelines." }
];

var N = GAMES.length;
var STEP = 360 / N;
var stage = document.getElementById("stage");
var ring = document.getElementById("ring");
var dotsBox = document.getElementById("dots");
var index = 0;
var radius = 0;

function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}

/* ----- Build cards ----- */
var cards = [], dots = [];
GAMES.forEach(function (g, i) {
  var c = document.createElement("div");
  c.className = "card";
  c.setAttribute("data-i", i);
  c.style.background = "radial-gradient(circle at 50% 30%, " + rgba(g.color, 0.28) + ", rgba(0,0,0,0) 65%), linear-gradient(180deg, rgba(24,26,44,0.97), rgba(10,11,20,0.98))";
  c.style.borderColor = rgba(g.color, 0.5);
  c.innerHTML = '<div class="icon">' + g.icon + '</div><div class="name">' + g.name +
                '</div><div class="tag" style="color:' + g.color + ';border-color:' + rgba(g.color, 0.6) + '">' + g.tag + '</div>';
  ring.appendChild(c);
  cards.push(c);

  var d = document.createElement("span");
  dotsBox.appendChild(d);
  dots.push(d);
});

/* ----- Size the cards from the real screen size (works on every phone) ----- */
function layout() {
  var stageH = stage.clientHeight;
  var w = Math.min(window.innerWidth * 0.48, stageH * 0.62, 230);
  w = Math.max(110, Math.round(w));
  var h = Math.round(w * 1.38);
  ring.style.width = w + "px";
  ring.style.height = h + "px";
  ring.style.setProperty("--cw", w + "px");
  radius = Math.round((w / 2) / Math.tan(Math.PI / N) + w * 0.15);
  cards.forEach(function (c, i) {
    c.style.transform = "rotateY(" + (i * STEP) + "deg) translateZ(" + radius + "px)";
  });
  render(0);
}

/* The ring is pushed back by its radius, so it spins on the spot */
function render(dragDeg) {
  ring.style.transform = "translateZ(" + (-radius) + "px) rotateY(" + (-index * STEP + dragDeg) + "deg)";
}

function activeIndex() { return ((index % N) + N) % N; }

function update() {
  render(0);
  var a = activeIndex(), g = GAMES[a];
  cards.forEach(function (c, i) {
    var on = i === a;
    c.classList.toggle("active", on);
    c.style.boxShadow = on ? "0 0 30px " + rgba(GAMES[i].color, 0.55) + ", inset 0 0 20px " + rgba(GAMES[i].color, 0.2) : "none";
    c.style.borderColor = rgba(GAMES[i].color, on ? 1 : 0.4);
  });
  dots.forEach(function (d, i) {
    d.className = i === a ? "on" : "";
    d.style.background = i === a ? g.color : "";
  });
  var nameEl = document.getElementById("gameName");
  nameEl.textContent = g.name;
  nameEl.style.color = g.color;
  document.getElementById("gameDesc").textContent = g.desc;
}

function goTo(i) {
  var diff = i - activeIndex();
  if (diff > N / 2) diff -= N;
  if (diff < -N / 2) diff += N;
  index += diff;
  update();
}

function openGame() {
  document.body.classList.add("leaving");
  var href = GAMES[activeIndex()].href;
  setTimeout(function () { location.href = href; }, 250);
}

/* ----- Finger swipe (with flick speed) ----- */
var SENS = 0.4;          // degrees turned per pixel of finger movement
var pressing = false, dragging = false, startX = 0, lastX = 0, lastT = 0, vel = 0, dragDeg = 0, pressedCard = null;

function down(x, target) {
  pressing = true; dragging = false;
  startX = lastX = x; lastT = Date.now(); vel = 0; dragDeg = 0;
  pressedCard = target && target.closest ? target.closest(".card") : null;
  startVideo();
}
function moveTo(x) {
  if (!pressing) return;
  var now = Date.now();
  vel = (x - lastX) / Math.max(1, now - lastT);
  lastX = x; lastT = now;
  var dx = x - startX;
  if (!dragging && Math.abs(dx) > 8) { dragging = true; ring.classList.add("dragging"); }
  if (dragging) { dragDeg = dx * SENS; render(dragDeg); }
}
function up() {
  if (!pressing) return;
  pressing = false;
  ring.classList.remove("dragging");
  if (dragging) {
    var flick = Math.max(-1.5, Math.min(1.5, vel)) * 180 * SENS;   // fast flick turns further
    index = Math.round(index - (dragDeg + flick) / STEP);
    update();
  } else if (pressedCard) {
    var i = Number(pressedCard.getAttribute("data-i"));
    if (i === activeIndex()) openGame(); else goTo(i);
  }
  pressedCard = null;
}

/* Touch (phones) */
stage.addEventListener("touchstart", function (e) { down(e.touches[0].clientX, e.target); }, { passive: true });
stage.addEventListener("touchmove",  function (e) { moveTo(e.touches[0].clientX); }, { passive: true });
stage.addEventListener("touchend", up);
stage.addEventListener("touchcancel", up);
/* Mouse (computers) */
stage.addEventListener("mousedown", function (e) { down(e.clientX, e.target); });
window.addEventListener("mousemove", function (e) { moveTo(e.clientX); });
window.addEventListener("mouseup", up);
/* Keyboard */
window.addEventListener("keydown", function (e) {
  if (e.key === "ArrowLeft")  { index--; update(); }
  if (e.key === "ArrowRight") { index++; update(); }
  if (e.key === "Enter") openGame();
});

document.getElementById("playBtn").addEventListener("click", openGame);

/* ----- Background video ----- */
var video = document.getElementById("bgVideo");
video.muted = true;
video.setAttribute("muted", "");
function startVideo() {
  if (!video.paused) return;
  var p = video.play();
  if (p && p.catch) p.catch(function () {});
}
startVideo();
video.addEventListener("loadeddata", startVideo);
document.addEventListener("touchstart", startVideo, { passive: true });
document.addEventListener("click", startVideo);
document.getElementById("bgSource").addEventListener("error", function () {
  document.getElementById("videoMsg").style.display = "block";
});
window.addEventListener("pageshow", function () {
  document.body.classList.remove("leaving");
  startVideo();
});

/* ----- Start ----- */
window.addEventListener("resize", layout);
layout();
update();
</script>
</body>
</html>
