<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05060a">
<title>Story Mode</title>
<script src="gamepass.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305060a'/%3E%3Cpath d='M20 22h24c8 0 12 6 13 14l1 8c1 6-6 9-10 4l-5-6H21l-5 6c-4 5-11 2-10-4l1-8c1-8 5-14 13-14z' fill='none' stroke='%2300f0ff' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Noto+Sans+Devanagari:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; min-height: 100%;
  background: #05060a; color: #eef4f8;
  font-family: 'Rajdhani', 'Segoe UI', sans-serif;
  user-select: none; -webkit-user-select: none;
}
body { overflow-x: hidden; }

/* same backdrop as the Game Zone hub, a little darker */
#bgVideo {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0; pointer-events: none; opacity: 0.45;
}
#bgShade {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(150,30,50,0.35), rgba(0,0,0,0) 60%),
    linear-gradient(180deg, rgba(5,6,10,0.75) 0%, rgba(5,6,10,0.45) 40%, rgba(5,6,10,0.9) 100%);
}
#sparks { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

.app {
  position: relative; z-index: 5;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 16px 24px;
  transition: opacity 0.35s ease;
}
.main { flex: 1 1 auto; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
body.leaving .app { opacity: 0; }

.top { width: 100%; max-width: 760px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.back, .sound-btn {
  height: 42px; border-radius: 21px; cursor: pointer;
  background: rgba(15,17,30,0.75); border: 1px solid rgba(255,255,255,0.18); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
}
.back { padding: 0 16px 0 12px; gap: 6px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px; text-decoration: none; }
.back svg, .sound-btn svg { width: 20px; height: 20px; }
.sound-btn { width: 42px; }

header { text-align: center; margin: 14px 0 18px; }
header h1 {
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 5px;
  color: #ffd27a;
  text-shadow: 0 0 14px rgba(255,170,60,0.6), 0 0 30px rgba(255,45,90,0.4);
}
header p { color: #c4cce0; font-size: 15px; letter-spacing: 1px; margin-top: 4px; }

.cards { width: 100%; max-width: 760px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 340px) { .cards { grid-template-columns: 1fr; } }

.card {
  position: relative; overflow: hidden; cursor: pointer;
  border-radius: 20px; border: 2px solid var(--c);
  background: #0a0b14;
  box-shadow: 0 0 26px var(--glow), inset 0 0 18px var(--glow);
  display: flex; flex-direction: column;
  transition: transform 0.18s ease, box-shadow 0.18s ease;
  text-align: left; color: inherit; font: inherit;
}
.card:active { transform: scale(0.97); }
.card:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.card .art-wrap { position: relative; aspect-ratio: 3 / 4; background: radial-gradient(circle at 50% 35%, var(--glow), #0a0b14 70%); }
.card .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; display: block; -webkit-user-drag: none; pointer-events: none; }
.card .art-wrap::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 70%, rgba(10,11,20,0.95) 100%); }
.card .chapter {
  position: absolute; top: 10px; left: 10px; z-index: 2;
  font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 2px;
  padding: 3px 9px; border-radius: 20px; background: rgba(5,6,10,0.8); border: 1px solid var(--c); color: var(--c);
}
.card .lock {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  padding: 3px 9px; border-radius: 20px;
  background: rgba(5,6,10,0.82); border: 1px solid rgba(255,207,63,0.7); color: #ffcf3f;
}
.card .info { padding: 10px 12px 14px; margin-top: -8px; position: relative; z-index: 2; }
.card h2 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; line-height: 1.2; color: var(--c); text-shadow: 0 0 10px var(--glow); }
.card .tag { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 20px; border: 1px solid var(--c); color: var(--c); }
.card .desc { margin-top: 7px; color: #d6dcec; font-size: 14px; line-height: 1.3; }
.card .play {
  margin-top: 10px; display: block; text-align: center;
  font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 2px;
  padding: 9px; border-radius: 12px; background: var(--c); color: #120a06;
}

.ticker { width: 100%; max-width: 760px; text-align: center; margin-top: 18px; font-family: 'Noto Sans Devanagari', 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700; color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.6); opacity: 0.85; }
</style>
</head>
<body>
<video id="bgVideo" autoplay muted loop playsinline webkit-playsinline>
  <source src="bg.mp4" type="video/mp4">
</video>
<div id="bgShade"></div>
<canvas id="sparks"></canvas>

<div class="app">
  <div class="top">
    <a class="back" href="index.html" id="backBtn" aria-label="Back to Game Zone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      GAME ZONE
    </a>
    <button class="sound-btn" id="soundBtn" aria-label="Sound on or off"></button>
  </div>

  <div class="main">
  <header>
    <h1>STORY MODE</h1>
    <p>Choose your story</p>
  </header>

  <div class="cards" id="cards"></div>

  </div>
  <div class="ticker">✦ Made With Love by Maa Kamakhya Group &bull; माँ कामाख्या ग्रुप द्वारा सप्रेम निर्मित ✦</div>
</div>

<script>
/* The two story games. They are the same pages the Game Zone used to open directly;
   this lobby only changes where they are reached from. */
var STORIES = [
  { href: "horror.html", locked: true, img: "card_horror.jpg", name: "The Last Night", tag: "Horror", color: "#ff3b5c", chapter: "STORY 1",
    desc: "One night in a house that belongs to the dead. Find a way out before morning." },
  { href: "laststand.html", img: "card_laststand.jpg", name: "Jais: Last Stand", tag: "Survival", color: "#e8b04a", chapter: "STORY 2",
    desc: "One life in Jais at night. Find the key and fuse, reach Guru Gorakhnath Dham." }
];

function getStore(t, k) { try { return window[t].getItem(k); } catch (e) { return null; } }
function setStore(t, k, v) { try { window[t].setItem(k, v); } catch (e) {} }
function rgba(hex, a) {
  var n = parseInt(hex.slice(1), 16);
  return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")";
}

/* A lobby, like the hub: any open game pass ends here */
if (window.GamePass) GamePass.endAllPasses();

/* ---------- sound (same hub music and mute setting as the Game Zone) ---------- */
var ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/></svg>';
var ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>';
var muted = getStore("localStorage", "gz_muted") === "1";
var leaving = false;
var music = new Audio("hub_music.mp3");
music.loop = true; music.volume = 0.45;
function setSoundIcon() { document.getElementById("soundBtn").innerHTML = muted ? ICON_OFF : ICON_ON; }
function startMusic() { if (muted || leaving) return; var p = music.play(); if (p && p.catch) p.catch(function () {}); }
function fadeOutMusic(ms) {
  var v0 = music.volume, t0 = Date.now();
  var t = setInterval(function () {
    var k = Math.min(1, (Date.now() - t0) / ms);
    music.volume = Math.max(0, v0 * (1 - k));
    if (k >= 1) { clearInterval(t); music.pause(); }
  }, 30);
}
setSoundIcon();
document.getElementById("soundBtn").addEventListener("click", function (e) {
  e.stopPropagation();
  muted = !muted;
  setStore("localStorage", "gz_muted", muted ? "1" : "0");
  setSoundIcon();
  if (muted) music.pause(); else startMusic();
});
startMusic();
document.addEventListener("touchstart", function () { if (music.paused) startMusic(); }, { passive: true });
document.addEventListener("click", function () { if (music.paused) startMusic(); });
document.addEventListener("visibilitychange", function () { if (document.hidden) music.pause(); else startMusic(); });
window.addEventListener("pageshow", function () {
  leaving = false;
  document.body.className = document.body.className.replace(/\s*leaving/g, "");
  if (window.GamePass) GamePass.endAllPasses();
  music.volume = 0.45; startMusic();
});

/* ---------- cards ---------- */
var box = document.getElementById("cards");
function go(href) {
  if (leaving) return;
  leaving = true;
  try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
  fadeOutMusic(400);
  document.body.className += " leaving";
  setTimeout(function () { location.href = href; }, 420);
}
STORIES.forEach(function (g) {
  var c = document.createElement("button");
  c.className = "card";
  c.type = "button";
  c.style.setProperty("--c", g.color);
  c.style.setProperty("--glow", rgba(g.color, 0.35));
  c.setAttribute("aria-label", "Play " + g.name);
  c.innerHTML =
    '<div class="art-wrap">' +
      '<img class="art" alt="" draggable="false" src="' + g.img + '">' +
      '<div class="chapter">' + g.chapter + '</div>' +
      (g.locked ? '<div class="lock">🔒 CODE</div>' : '') +
    '</div>' +
    '<div class="info">' +
      '<h2>' + g.name + '</h2>' +
      '<span class="tag">' + g.tag + '</span>' +
      '<p class="desc">' + g.desc + '</p>' +
      '<span class="play">▶ PLAY</span>' +
    '</div>';
  var im = c.querySelector(".art");
  im.onerror = function () { im.parentNode && im.parentNode.removeChild(im); };
  c.addEventListener("click", function () { go(g.href); });
  box.appendChild(c);
});
document.getElementById("backBtn").addEventListener("click", function (e) {
  e.preventDefault();
  if (leaving) return;
  leaving = true;
  fadeOutMusic(300);
  document.body.className += " leaving";
  setTimeout(function () { location.href = "index.html"; }, 320);
});

/* ---------- video + sparks (as in the hub) ---------- */
var video = document.getElementById("bgVideo");
function startVideo() { video.muted = true; if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(function () {}); } }
startVideo();
video.addEventListener("loadeddata", startVideo);

var cv = document.getElementById("sparks"), cx = cv.getContext("2d"), parts = [];
function sizeSparks() {
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
for (var k = 0; k < 24; k++) {
  parts.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: 0.6 + Math.random() * 1.8, s: 0.15 + Math.random() * 0.45,
               c: Math.random() < 0.5 ? "255,190,90" : "255,60,90", a: Math.random() * 6.28 });
}
function loop() {
  if (!document.hidden) {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y -= p.s; p.a += 0.02; p.x += Math.sin(p.a) * 0.3;
      if (p.y < -10) { p.y = innerHeight + 10; p.x = Math.random() * innerWidth; }
      cx.beginPath(); cx.fillStyle = "rgba(" + p.c + "," + (0.35 + Math.sin(p.a) * 0.25) + ")";
      cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
    }
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", sizeSparks);
sizeSparks(); loop();
</script>
</body>
</html>
