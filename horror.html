<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Last Night</title>
<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #080808;
}

/* =========================
   2.5D ROOM VIEWPORT
========================= */
.room {
    position: absolute;
    inset: 0;
    perspective: 900px;
    overflow: hidden;
    transform-origin: center center;
    transition: transform 0.08s linear;
}

.ceiling {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 42%;
    background: linear-gradient(rgba(10,10,10,0.95), rgba(30,30,30,0.8));
    clip-path: polygon(0 0, 100% 0, 76% 100%, 24% 100%);
}

.wall-left {
    position: absolute;
    left: 0;
    top: 20%;
    width: 50%;
    height: 55%;
    background: linear-gradient(90deg, #0e0e0e 0%, #252525 100%);
    clip-path: polygon(0 0, 100% 18%, 100% 100%, 0 100%);
}

.wall-right {
    position: absolute;
    right: 0;
    top: 20%;
    width: 50%;
    height: 55%;
    background: linear-gradient(90deg, #252525 0%, #0a0a0a 100%);
    clip-path: polygon(0 18%, 100% 0, 100% 100%, 0 100%);
}

.floor {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 58%;
    background: repeating-linear-gradient(0deg, #0d0d0d 0px, #0d0d0d 35px, #161616 36px, #161616 38px);
    clip-path: polygon(24% 0, 76% 0, 100% 100%, 0 100%);
}

/* =========================
   INTERACTIVE OBJECTS
========================= */
.interactable {
    cursor: pointer;
    z-index: 25;
}

.door {
    position: absolute;
    left: 50%;
    top: 27%;
    transform: translateX(-50%);
    width: 125px;
    height: 230px;
    background: linear-gradient(90deg, #090909, #242424, #090909);
    border: 5px solid #080808;
    box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 25px black;
}

.door::before {
    content: "";
    position: absolute;
    inset: 15px;
    border: 1px solid #383838;
}

.door-handle {
    position: absolute;
    right: 13px;
    top: 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #777;
}

.painting {
    position: absolute;
    left: 13%;
    top: 33%;
    width: 70px;
    height: 95px;
    background: #090909;
    border: 5px solid #27201a;
    box-shadow: 0 0 15px black;
}

.painting::after {
    content: "👁";
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    filter: grayscale(1);
    opacity: 0.25;
    transition: 0.3s;
}

.painting.angry::after {
    content: "💀";
    filter: none;
    opacity: 0.8;
}

.table {
    position: absolute;
    right: 12%;
    bottom: 24%;
    width: 105px;
    height: 55px;
    background: #17100c;
    transform: skewY(-5deg);
    box-shadow: 0 15px 20px black;
}

.table::before, .table::after {
    content: "";
    position: absolute;
    bottom: -65px;
    width: 10px;
    height: 65px;
    background: #0b0806;
}

.table::before { left: 12px; }
.table::after { right: 12px; }

.candle {
    position: absolute;
    left: 25px;
    top: -30px;
    width: 12px;
    height: 30px;
    background: #d5c7a0;
}

.flame {
    position: absolute;
    left: 1px;
    top: -18px;
    width: 10px;
    height: 18px;
    background: #ff8a00;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff6a00, 0 0 30px rgba(255,100,0,0.5);
    animation: flicker 0.12s infinite alternate;
}

@keyframes flicker {
    from { transform: scale(0.9) rotate(-3deg); }
    to { transform: scale(1.1) rotate(4deg); }
}

/* =========================
   LIGHTING & VHS
========================= */
.darkness {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at var(--lx, 50%) var(--ly, 52%), transparent 30px, rgba(0,0,0,0.72) 170px, rgba(0,0,0,0.97) 360px);
    z-index: 20;
}

.flashlight {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 21;
    background: radial-gradient(circle at var(--lx, 50%) var(--ly, 52%), rgba(255,255,220,0.22) 0px, rgba(255,255,220,0.06) 130px, transparent 250px);
    mix-blend-mode: screen;
}

.vhs {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
    opacity: 0.15;
    background: repeating-linear-gradient(0deg, transparent 0px, transparent 3px, rgba(255,255,255,0.08) 4px);
}

/* =========================
   HUD & MESSAGES
========================= */
.hud {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    z-index: 40;
    font-size: 12px;
    letter-spacing: 2px;
    color: #888;
    text-shadow: 0 0 8px black;
}

.hud strong { color: #eee; }

#message {
    position: absolute;
    left: 50%;
    bottom: 35px;
    transform: translateX(-50%);
    z-index: 50;
    width: 90%;
    text-align: center;
    font-size: 15px;
    letter-spacing: 1px;
    color: #ddd;
    text-shadow: 0 0 10px black;
}

/* =========================
   VIRTUAL JOYSTICK
========================= */
#joystickContainer {
    position: absolute;
    bottom: 30px;
    left: 30px;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05);
    border: 2px solid rgba(255, 255, 255, 0.2);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    z-index: 60;
    touch-action: none;
}

#joystickKnob {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    margin-top: -22px;
    margin-left: -22px;
    border-radius: 50%;
    background: rgba(180, 0, 0, 0.6);
    border: 2px solid rgba(255, 100, 100, 0.5);
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
    pointer-events: none;
}

/* =========================
   JUMPSCARE SCREEN
========================= */
#jumpscareOverlay {
    position: absolute;
    inset: 0;
    z-index: 200;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#jumpscareFace {
    font-size: 180px;
    color: #b00;
    animation: shake 0.08s infinite alternate;
    filter: drop-shadow(0 0 40px red);
}

@keyframes shake {
    0% { transform: scale(1.1) translate(-10px, 8px) rotate(-4deg); }
    100% { transform: scale(1.25) translate(12px, -8px) rotate(5deg); }
}

/* SCREENS */
#startScreen, #endScreen {
    position: absolute;
    inset: 0;
    z-index: 100;
    background: radial-gradient(circle, #191919, #020202 70%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#endScreen { display: none; }

h1 {
    margin: 0;
    font-size: 38px;
    letter-spacing: 6px;
    color: #ddd;
    text-shadow: 0 0 15px #900, 0 0 35px #300;
}

p {
    max-width: 320px;
    color: #777;
    line-height: 1.6;
    margin: 15px 20px 30px;
}

.btn {
    padding: 14px 28px;
    background: transparent;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 4px;
    letter-spacing: 3px;
    cursor: pointer;
    text-decoration: none;
}

.btn:hover {
    background: #222;
    border-color: #aaa;
}
</style>
</head>
<body>

<div id="game">
    <!-- START SCREEN -->
    <div id="startScreen">
        <h1>THE LAST NIGHT</h1>
        <p>Something lurks inside.<br>Use the joystick or W/A/S/D to move, inspect clues, and escape.</p>
        <button id="startButton" class="btn">ENTER</button>
    </div>

    <!-- END SCREEN -->
    <div id="endScreen">
        <h1 id="endTitle">YOU ESCAPED</h1>
        <p id="endDesc">You survived the night.</p>
        <a href="index.html" class="btn">BACK TO STORE</a>
    </div>

    <!-- JUMPSCARE FLASH -->
    <div id="jumpscareOverlay">
        <div id="jumpscareFace">👹</div>
    </div>

    <!-- ROOM -->
    <div class="room" id="room">
        <div class="ceiling"></div>
        <div class="wall-left"></div>
        <div class="wall-right"></div>
        <div class="floor"></div>

        <div class="painting interactable" id="painting"></div>
        <div class="door interactable" id="door">
            <div class="door-handle"></div>
        </div>
        <div class="table interactable" id="table">
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>
    </div>

    <!-- ATMOSPHERE -->
    <div class="darkness"></div>
    <div class="flashlight"></div>
    <div class="vhs"></div>

    <!-- HUD -->
    <div class="hud">
        <span>ITEM: <strong id="invStatus">NONE</strong></span>
        <span>OBJECTIVE: <strong id="hudObjective">SEARCH ROOM</strong></span>
    </div>

    <div id="message">Find a way out...</div>

    <!-- JOYSTICK -->
    <div id="joystickContainer">
        <div id="joystickKnob"></div>
    </div>
</div>

<!-- =========================
     AUDIO ELEMENTS
========================= -->
<!-- Core sounds -->
<audio id="audioAmbient" loop src="ambient.mp3" preload="auto"></audio>
<audio id="audioFootstep" src="footstep.mp3" preload="auto"></audio>
<audio id="audioUnlock" src="unlock.mp3" preload="auto"></audio>

<!-- 10 Jumpscare Audios Pool -->
<audio class="scare-sound" src="scare1.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare2.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare3.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare4.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare5.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare6.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare7.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare8.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare9.mp3" preload="auto"></audio>
<audio class="scare-sound" src="scare10.mp3" preload="auto"></audio>

<script>
const startScreen = document.getElementById("startScreen");
const endScreen = document.getElementById("endScreen");
const startButton = document.getElementById("startButton");
const message = document.getElementById("message");
const invStatus = document.getElementById("invStatus");
const hudObjective = document.getElementById("hudObjective");
const room = document.getElementById("room");
const jumpscareOverlay = document.getElementById("jumpscareOverlay");
const paintingEl = document.getElementById("painting");

let gameStarted = false;
let hasKey = false;
let paintingInspected = false;

// Movement coordinates
let posX = 0;
let posY = 0;
let targetX = 0;
let targetY = 0;

/* ====================================================
   AUDIO ENGINE (Multi-Audio Support + Synth Fallback)
==================================================== */
const audioAmbient = document.getElementById("audioAmbient");
const audioFootstep = document.getElementById("audioFootstep");
const audioUnlock = document.getElementById("audioUnlock");
const jumpscareAudios = Array.from(document.querySelectorAll(".scare-sound"));

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    audioAmbient.play().catch(() => {
        playSynthDrone();
    });
}

function playFootstep() {
    if (!audioFootstep.paused) return;
    audioFootstep.currentTime = 0;
    audioFootstep.play().catch(() => {
        playSynthStep();
    });
}

function playJumpscareSound() {
    if (jumpscareAudios.length > 0) {
        const randomIndex = Math.floor(Math.random() * jumpscareAudios.length);
        const selectedAudio = jumpscareAudios[randomIndex];

        selectedAudio.currentTime = 0;
        selectedAudio.play().catch(() => {
            playSynthScreamer();
        });
    } else {
        playSynthScreamer();
    }
}

function playUnlockSound() {
    audioUnlock.currentTime = 0;
    audioUnlock.play().catch(() => {
        playSynthChime();
    });
}

// Built-in Synth generators
function playSynthDrone() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(45, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
}

function playSynthStep() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(80, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

function playSynthScreamer() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(900, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(220, audioCtx.currentTime + 1.2);
    gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.2);
}

function playSynthChime() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

/* ====================================================
   START GAME
==================================================== */
startButton.addEventListener("click", () => {
    gameStarted = true;
    startScreen.style.display = "none";
    initAudio();
    setMessage("The door is bolted shut. Inspect the room.");
});

function setMessage(txt) {
    message.innerText = txt;
}

/* ====================================================
   FLASHLIGHT POINTER TRACKING
==================================================== */
window.addEventListener("pointermove", (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty("--lx", `${x}%`);
    document.documentElement.style.setProperty("--ly", `${y}%`);
});

/* ====================================================
   JUMPSCARE TRIGGER
==================================================== */
function triggerJumpscare() {
    playJumpscareSound();
    jumpscareOverlay.style.display = "flex";
    paintingEl.classList.add("angry");

    setTimeout(() => {
        jumpscareOverlay.style.display = "none";
        setMessage("SOMETHING WAS WATCHING YOU.");
    }, 1100);
}

/* ====================================================
   INTERACTIONS
==================================================== */
paintingEl.addEventListener("click", () => {
    if (!gameStarted) return;
    if (!paintingInspected) {
        paintingInspected = true;
        setMessage("You inspect the painting... Something rattles behind you!");
        setTimeout(triggerJumpscare, 300);
    } else {
        setMessage("The eyes continue to stare unblinkingly.");
    }
});

document.getElementById("table").addEventListener("click", () => {
    if (!gameStarted) return;
    if (paintingInspected && !hasKey) {
        hasKey = true;
        playUnlockSound();
        invStatus.innerText = "BRASS KEY";
        hudObjective.innerText = "UNLOCK DOOR";
        setMessage("You found a cold brass key under the candle wax!");
    } else if (!hasKey) {
        setMessage("Just an old table and a burning candle.");
    } else {
        setMessage("Nothing else is on the table.");
    }
});

document.getElementById("door").addEventListener("click", () => {
    if (!gameStarted) return;
    if (hasKey) {
        playUnlockSound();
        endScreen.style.display = "flex";
        gameStarted = false;
    } else {
        setMessage("The door is locked. Find the key!");
    }
});

/* ====================================================
   JOYSTICK MECHANICS
==================================================== */
const joystickContainer = document.getElementById("joystickContainer");
const joystickKnob = document.getElementById("joystickKnob");
let joystickActive = false;
let joystickCenter = { x: 0, y: 0 };
const maxRadius = 40;

joystickContainer.addEventListener("pointerdown", (e) => {
    joystickActive = true;
    const rect = joystickContainer.getBoundingClientRect();
    joystickCenter = {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
    };
    updateJoystick(e);
});

window.addEventListener("pointermove", (e) => {
    if (!joystickActive) return;
    updateJoystick(e);
});

function resetJoystick() {
    joystickActive = false;
    joystickKnob.style.transform = `translate(0px, 0px)`;
    targetX = 0;
    targetY = 0;
}

window.addEventListener("pointerup", resetJoystick);
window.addEventListener("pointercancel", resetJoystick);

function updateJoystick(e) {
    const dx = e.clientX - joystickCenter.x;
    const dy = e.clientY - joystickCenter.y;
    const dist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);
    const clampedDist = Math.min(dist, maxRadius);

    const knobX = Math.cos(angle) * clampedDist;
    const knobY = Math.sin(angle) * clampedDist;

    joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

    targetX = (knobX / maxRadius);
    targetY = -(knobY / maxRadius);
}

/* ====================================================
   KEYBOARD SUPPORT
==================================================== */
const keys = {};
window.addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });

/* ====================================================
   MAIN LOOP
==================================================== */
let stepCounter = 0;

function gameLoop() {
    if (gameStarted) {
        let moveX = targetX;
        let moveY = targetY;

        if (keys["w"] || keys["arrowup"]) moveY = 1;
        if (keys["s"] || keys["arrowdown"]) moveY = -1;
        if (keys["a"] || keys["arrowleft"]) moveX = -1;
        if (keys["d"] || keys["arrowright"]) moveX = 1;

        if (moveX !== 0 || moveY !== 0) {
            posX = Math.max(-60, Math.min(60, posX + moveX * 2));
            posY = Math.max(-20, Math.min(60, posY + moveY * 1.5));

            stepCounter++;
            if (stepCounter % 22 === 0) {
                playFootstep();
            }

            room.style.transform = `scale(${1 + posY / 150}) translateX(${posX}px)`;
        }
    }
    requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Ambient whispers
setInterval(() => {
    if (!gameStarted) return;
    const whispers = [
        "Did you hear that?",
        "Something moved behind you.",
        "The candle is flickering...",
        "Footsteps echo from the boards.",
        "The air suddenly turned freezing."
    ];
    if (Math.random() < 0.25) {
        setMessage(whispers[Math.floor(Math.random() * whispers.length)]);
    }
}, 7000);
</script>
</body>
</html>
