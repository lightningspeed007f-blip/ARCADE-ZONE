<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<title>Jais Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060d'/%3E%3Cpath d='M12 42V22q0-8 9-8h17q8 0 12 11l3 17M24 42V24h15l5 11' fill='none' stroke='%23ff9a1f' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='18' cy='47' r='6' fill='none' stroke='%23ff9a1f' stroke-width='3'/%3E%3Ccircle cx='51' cy='48' r='5' fill='none' stroke='%23ff9a1f' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --bg: #07060d; --panel: rgba(16, 13, 30, 0.88); --line: rgba(255,255,255,0.12);
  --gold: #ffcf3f; --orange: #ff9a1f; --purple: #b46bff; --pink: #ff2d8a; --cyan: #00f0ff; --green: #8aff3c; --red: #ff4757;
  --text: #f1f3f8; --muted: #9aa3bd;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Rajdhani', 'Segoe UI', sans-serif; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; cursor: pointer; border: none; }
.hidden { display: none !important; }

#game { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- Corner buttons ---------- */
.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(14, 12, 26, 0.75); border: 1px solid var(--line); color: #fff;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.icon-btn svg { width: 20px; height: 20px; }
#soundBtn { position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 12px; z-index: 40; }

/* ---------- HUD ---------- */
#hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
.hud-top {
  display: flex; align-items: center; gap: 8px;
  padding: calc(12px + env(safe-area-inset-top)) 62px 0 12px;
}
.hud-top .icon-btn { pointer-events: auto; }
.stats { flex: 1; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 6px; }
.stat {
  background: rgba(14, 12, 26, 0.72); border: 1px solid var(--line); border-radius: 12px;
  text-align: center; padding: 4px 2px;
}
.stat small { display: block; font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 1px; color: var(--muted); }
.stat b { font-family: 'Orbitron', sans-serif; font-size: 15px; }
#hScore { color: var(--gold); }
#hSpeed { color: var(--cyan); }
.hud-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 12px 0; gap: 8px; }
.lives { display: flex; gap: 4px; }
.lives svg { width: 20px; height: 20px; }
.chips { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.chip {
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  background: rgba(14, 12, 26, 0.78); border: 1px solid var(--line); border-radius: 30px;
  padding: 3px 10px; white-space: nowrap; max-width: 62vw; overflow: hidden; text-overflow: ellipsis;
}
.chip.rival { color: var(--gold); border-color: rgba(255,207,63,0.4); }
.chip.ghost { color: var(--cyan); border-color: rgba(0,240,255,0.4); }
#combo {
  position: absolute; left: 14px; top: calc(118px + env(safe-area-inset-top));
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 22px; color: var(--pink);
  text-shadow: 0 0 12px rgba(255,45,138,0.8); opacity: 0; transition: opacity 0.2s;
}
#combo.on { opacity: 1; }

/* Nitro button */
#nitroBtn {
  position: absolute; right: 16px; bottom: calc(22px + env(safe-area-inset-bottom));
  width: 74px; height: 74px; border-radius: 50%; pointer-events: auto;
  background: rgba(14, 12, 26, 0.8); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
}
#nitroBtn svg.ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
#nitroBtn span { font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 900; letter-spacing: 1px; }
#nitroBtn.ready { color: #fff; box-shadow: 0 0 24px rgba(0,240,255,0.7); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }

/* Toasts */
#toast {
  position: fixed; left: 50%; top: 34%; transform: translate(-50%, -50%) scale(0.8);
  z-index: 15; pointer-events: none; opacity: 0; transition: opacity 0.2s, transform 0.2s;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 20px; letter-spacing: 1px; text-align: center;
  text-shadow: 0 0 14px currentColor; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
#station {
  position: fixed; left: 50%; top: calc(150px + env(safe-area-inset-top)); transform: translateX(-50%);
  z-index: 14; pointer-events: none; opacity: 0; transition: opacity 0.4s;
  background: rgba(14, 12, 26, 0.85); border: 1px solid rgba(255,154,31,0.6); border-radius: 12px;
  padding: 6px 16px; text-align: center; white-space: nowrap;
}
#station.show { opacity: 1; }
#station small { display: block; font-size: 11px; letter-spacing: 3px; color: var(--muted); }
#station b { font-family: 'Orbitron', sans-serif; font-size: 16px; color: var(--orange); }
#countdown {
  position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
  z-index: 16; pointer-events: none;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 96px; color: #fff;
  text-shadow: 0 0 30px var(--orange), 0 0 60px var(--pink);
}

/* ---------- Screens ---------- */
.screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(circle at 50% 20%, rgba(60, 20, 90, 0.55), rgba(7, 6, 13, 0.94) 70%);
  display: flex; flex-direction: column; align-items: center;
  padding: calc(14px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
}
.wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }
.back {
  align-self: flex-start; color: var(--gold); text-decoration: none;
  font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1px;
  background: rgba(14, 12, 26, 0.8); border: 1px solid var(--line); border-radius: 30px; padding: 8px 14px;
}
.poster {
  margin: 12px 0 10px; max-height: 38vh; max-width: 70vw; width: auto; height: auto;
  border-radius: 18px; border: 2px solid rgba(255,154,31,0.7);
  box-shadow: 0 0 34px rgba(255,154,31,0.45), 0 0 70px rgba(180,107,255,0.3);
}
.title-fallback {
  margin: 22px 0 14px; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 34px; letter-spacing: 3px;
  color: var(--orange); text-shadow: 0 0 20px rgba(255,154,31,0.6);
}
.howto { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.4; margin-bottom: 12px; }
.howto b { color: var(--text); }
.name-row { width: 100%; display: flex; gap: 8px; margin-bottom: 10px; }
.name-row input {
  flex: 1; min-width: 0; background: rgba(14, 12, 26, 0.9); color: #fff;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px;
  font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; outline: none;
}
.name-row input:focus { border-color: var(--orange); }
.btn {
  width: 100%; padding: 15px; border-radius: 14px;
  font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; letter-spacing: 2px; color: #170b00;
  background: linear-gradient(90deg, var(--gold), var(--orange));
  box-shadow: 0 8px 24px rgba(255,154,31,0.4);
}
.btn:active { transform: scale(0.97); }
.btn.ghost-btn { background: rgba(14, 12, 26, 0.9); color: #fff; border: 1.5px solid var(--line); box-shadow: none; margin-top: 10px; }
.err { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 6px; text-align: center; }
.ghost-note { color: var(--cyan); font-size: 13.5px; margin-top: 8px; text-align: center; min-height: 18px; }

/* Leaderboard */
.board { width: 100%; margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; }
.board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.board-head b { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 1.5px; color: var(--gold); }
.badge { font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 2px 8px; border-radius: 20px; border: 1px solid; }
.badge.live { color: var(--green); border-color: rgba(138,255,60,0.5); }
.badge.local { color: var(--muted); border-color: var(--line); }
.tabs { display: flex; gap: 6px; margin-bottom: 8px; }
.tabs button {
  flex: 1; padding: 7px; border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--muted);
  font-family: 'Orbitron', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1px;
}
.tabs button.on { background: rgba(255,154,31,0.18); color: var(--orange); }
.row { display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; padding: 6px 2px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 15px; font-weight: 600; }
.row:first-child { border-top: none; }
.row .rk { font-family: 'Orbitron', sans-serif; font-size: 12px; color: var(--muted); padding-top: 2px; }
.row.r1 .rk { color: #ffd700; } .row.r2 .rk { color: #d6dde8; } .row.r3 .rk { color: #e3995b; }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sc { font-family: 'Orbitron', sans-serif; font-size: 13px; color: var(--gold); }
.row.me { background: rgba(0,240,255,0.08); border-radius: 8px; }
.row.me .nm { color: var(--cyan); }
.empty { color: var(--muted); text-align: center; padding: 10px; font-size: 14px; }

/* Game over */
.over-icon { width: 76px; height: 76px; margin-top: 18px; }
.over-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 26px; letter-spacing: 2px; margin-top: 8px; }
.big-score { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 48px; color: var(--gold); text-shadow: 0 0 24px rgba(255,207,63,0.5); margin-top: 4px; }
.over-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 12px 0; }
.over-stats .stat b { font-size: 16px; }
.rank-line { color: var(--text); font-size: 16px; text-align: center; margin-bottom: 14px; min-height: 22px; }
.rank-line b { color: var(--cyan); }
.pause-title { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 30px; letter-spacing: 4px; margin: 30vh 0 24px; }
</style>
</head>
<body>

<canvas id="game"></canvas>
<button class="icon-btn" id="soundBtn" aria-label="Sound on or off"></button>

<!-- ===== HUD (during the drive) ===== -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <div class="stats">
      <div class="stat"><small>SCORE</small><b id="hScore">0</b></div>
      <div class="stat"><small>DISTANCE</small><b id="hDist">0m</b></div>
      <div class="stat"><small>KM/H</small><b id="hSpeed">0</b></div>
    </div>
  </div>
  <div class="hud-row">
    <div class="lives" id="hLives"></div>
    <div class="chips">
      <div class="chip rival" id="rivalChip"></div>
      <div class="chip ghost hidden" id="ghostChip"></div>
    </div>
  </div>
  <div id="combo"></div>
  <button id="nitroBtn" aria-label="Nitro">
    <svg class="ring" viewBox="0 0 74 74">
      <circle cx="37" cy="37" r="33" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
      <circle id="nitroArc" cx="37" cy="37" r="33" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" stroke-dasharray="207.3" stroke-dashoffset="207.3"/>
    </svg>
    <span>NITRO</span>
  </button>
</div>
<div id="toast"></div>
<div id="station"><small>ENTERING</small><b id="stationName"></b></div>
<div id="countdown" class="hidden"></div>

<!-- ===== START SCREEN ===== -->
<section class="screen" id="startScreen">
  <div class="wrap">
    <a class="back" href="index.html">‹ GAME ZONE</a>
    <img class="poster" id="poster" src="card_jais.jpg" alt="Jais Express">
    <div class="title-fallback hidden" id="titleFallback">JAIS EXPRESS</div>
    <p class="howto"><b>Tap left / right</b> or swipe to change lanes<br><b>Swipe up</b> or press <b>NITRO</b> to boost and smash through traffic</p>
    <div class="name-row"><input id="nameInput" maxlength="12" placeholder="YOUR NAME" autocomplete="off"></div>
    <button class="btn" id="startBtn">START DRIVE</button>
    <div class="err" id="nameErr"></div>
    <div class="ghost-note" id="ghostNote"></div>
    <div class="board">
      <div class="board-head"><b>TOP DRIVERS</b><span class="badge local" id="boardBadge">THIS PHONE</span></div>
      <div class="tabs"><button data-tab="today" class="on">TODAY</button><button data-tab="all">ALL TIME</button></div>
      <div id="boardRows"><div class="empty">Loading…</div></div>
    </div>
  </div>
</section>

<!-- ===== GAME OVER ===== -->
<section class="screen hidden" id="overScreen">
  <div class="wrap">
    <div class="over-icon" id="overIcon"></div>
    <div class="over-title" id="overTitle">RIDE OVER</div>
    <div class="big-score" id="overScore">0</div>
    <div class="over-stats">
      <div class="stat"><small>DISTANCE</small><b id="oDist">0m</b></div>
      <div class="stat"><small>COINS</small><b id="oCoins">0</b></div>
      <div class="stat"><small>NEAR MISSES</small><b id="oNear">0</b></div>
    </div>
    <div class="rank-line" id="rankLine">Saving your score…</div>
    <button class="btn" id="againBtn">DRIVE AGAIN</button>
    <button class="btn ghost-btn" id="menuBtn">MAIN MENU</button>
    <div class="board">
      <div class="board-head"><b>TOP DRIVERS</b><span class="badge local" id="boardBadge2">THIS PHONE</span></div>
      <div class="tabs"><button data-tab="today" class="on">TODAY</button><button data-tab="all">ALL TIME</button></div>
      <div id="boardRows2"><div class="empty">Loading…</div></div>
    </div>
  </div>
</section>

<!-- ===== PAUSE ===== -->
<section class="screen hidden" id="pauseScreen">
  <div class="wrap">
    <div class="pause-title">PAUSED</div>
    <button class="btn" id="resumeBtn">RESUME</button>
    <button class="btn ghost-btn" id="quitBtn">END DRIVE</button>
  </div>
</section>

<script>
"use strict";
/* =====================================================================
   1) LIVE LEADERBOARD SETTINGS
   Paste your Firebase details here to make the leaderboard and ghost
   shared by everyone. Leave empty = scores are saved on each phone only.
   ===================================================================== */
const FIREBASE = {
  apiKey: "AIzaSyCki1mqUIMVZORNGCUqFwhmY22KSge9RpA",
  projectId: "game-zone-1192f"
};
const COLLECTION = "jais_scores";

/* =====================================================================
   2) ROUTE, IMAGES, MUSIC (files already in your repo)
   ===================================================================== */
const ROUTES = ["WAHABGANJ", "NAUGAJI", "SONAR GALI", "BUS ADDA", "SHEKHANA", "ALIA MARKET",
                "CHAUDHRANA", "NASIRABAD", "KASIMPUR", "KHARKA", "MALIK MOHAMMAD JAISI"];
const STATION_LEN = 260;      // metres between stations
const IMAGE_COUNT = 10;       // route1.jpg ... route10.jpg
const TRACK_COUNT = 4;        // bg1.mp3 ... bg4.mp3 (raise this if you upload more tracks)

const ONLINE = !!(FIREBASE.apiKey && FIREBASE.projectId);
const $ = id => document.getElementById(id);

/* ---------- small helpers ---------- */
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
function fmt(n) { return Math.floor(n).toLocaleString("en-IN"); }
function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

/* ---------- icons ---------- */
const ICON = {
  soundOn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/></svg>',
  soundOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l6 6M22 9l-6 6"/></svg>',
  heart: c => '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="' + c + '"/></svg>',
  trophy: '<svg viewBox="0 0 64 64" fill="none" stroke="#ffcf3f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px #ffcf3f)"><path d="M20 8h24v14a12 12 0 0 1-24 0z"/><path d="M20 12H10v4a10 10 0 0 0 10 10M44 12h10v4a10 10 0 0 1-10 10M32 34v10M22 56h20M25 56l2-12h10l2 12"/></svg>',
  crash: '<svg viewBox="0 0 64 64" fill="none" stroke="#ff4757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 10px #ff4757)"><path d="M32 6l5 15 15-6-7 14 14 5-14 6 6 14-15-6-4 14-5-14-15 6 6-14-14-6 14-5-7-14 15 6z"/></svg>'
};

/* =====================================================================
   SOUND
   ===================================================================== */
let soundOn = lsGet("jx_sound", true);
let actx = null;
function audioCtx() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, len, vol, type, slideTo) {
  if (!soundOn) return;
  const a = audioCtx(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + len);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + len);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + len);
  } catch (e) {}
}
function makeSfx(src) { const a = new Audio(); a.preload = "auto"; a.bad = false; a.addEventListener("error", () => a.bad = true); a.src = src; return a; }
const SFX = { coin: makeSfx("coin.mp3"), crash: makeSfx("crash.mp3"), steer: makeSfx("steer.mp3") };
const SFX_FALLBACK = {
  coin: () => tone(850, 0.12, 0.18, "triangle", 1300),
  crash: () => tone(140, 0.35, 0.3, "sawtooth", 30),
  steer: () => tone(260, 0.05, 0.06, "sine")
};
function sfx(name) {
  if (!soundOn) return;
  const a = SFX[name];
  if (!a || a.bad) { SFX_FALLBACK[name](); return; }
  try { a.currentTime = 0; a.volume = 0.5; const p = a.play(); if (p && p.catch) p.catch(SFX_FALLBACK[name]); }
  catch (e) { SFX_FALLBACK[name](); }
}

/* Background music: one track at a time, shuffled, loaded only when needed */
const music = new Audio();
music.volume = 0.35; music.preload = "none";
let musicQueue = [], lastTrack = 0, musicErrors = 0, musicWanted = false;
function nextTrack() {
  if (!soundOn || !musicWanted) return;
  if (!musicQueue.length) {
    musicQueue = Array.from({ length: TRACK_COUNT }, (_, i) => i + 1);
    for (let i = musicQueue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [musicQueue[i], musicQueue[j]] = [musicQueue[j], musicQueue[i]]; }
    if (musicQueue[musicQueue.length - 1] === lastTrack && musicQueue.length > 1) { const t = musicQueue[0]; musicQueue[0] = musicQueue[musicQueue.length - 1]; musicQueue[musicQueue.length - 1] = t; }
  }
  lastTrack = musicQueue.pop();
  music.src = "bg" + lastTrack + ".mp3";
  const p = music.play(); if (p && p.catch) p.catch(() => {});
}
music.addEventListener("ended", nextTrack);
music.addEventListener("playing", () => { musicErrors = 0; });
music.addEventListener("error", () => { if (musicWanted && ++musicErrors < TRACK_COUNT) setTimeout(nextTrack, 200); });

/* =====================================================================
   LEADERBOARD (Firebase if set up, otherwise this phone)
   ===================================================================== */
let liveOk = ONLINE;
function fsUrl(path) { return "https://firestore.googleapis.com/v1/projects/" + FIREBASE.projectId + "/databases/(default)/documents" + path + "?key=" + FIREBASE.apiKey; }
function parseDoc(f) {
  const v = x => !x ? undefined : (x.stringValue !== undefined ? x.stringValue : (x.integerValue !== undefined ? Number(x.integerValue) : x.doubleValue));
  return { name: v(f.name) || "DRIVER", score: Number(v(f.score)) || 0, distance: Number(v(f.distance)) || 0,
           coins: Number(v(f.coins)) || 0, day: v(f.day) || "", ghost: v(f.ghost) || "" };
}
async function fsQuery(q) {
  const r = await fetch(fsUrl(":runQuery"), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ structuredQuery: q }) });
  if (!r.ok) throw new Error("query failed");
  const data = await r.json();
  return data.filter(d => d.document).map(d => parseDoc(d.document.fields || {}));
}
async function getBoard(mode) {
  if (ONLINE) {
    try {
      let rows;
      if (mode === "today") {
        rows = await fsQuery({ from: [{ collectionId: COLLECTION }], where: { fieldFilter: { field: { fieldPath: "day" }, op: "EQUAL", value: { stringValue: today() } } }, limit: 300 });
        rows.sort((a, b) => b.score - a.score);
      } else {
        rows = await fsQuery({ from: [{ collectionId: COLLECTION }], orderBy: [{ field: { fieldPath: "score" }, direction: "DESCENDING" }], limit: 20 });
      }
      liveOk = true;
      return rows.slice(0, 20);
    } catch (e) { liveOk = false; }
  }
  const runs = lsGet("jx_runs", []);
  const rows = mode === "today" ? runs.filter(r => r.day === today()) : runs.slice();
  return rows.sort((a, b) => b.score - a.score).slice(0, 20);
}
async function submitOnline(run) {
  if (!ONLINE) return false;
  try {
    const body = { fields: {
      name: { stringValue: run.name }, score: { integerValue: String(run.score) },
      distance: { integerValue: String(run.distance) }, coins: { integerValue: String(run.coins) },
      day: { stringValue: run.day }, ghost: { stringValue: run.ghost },
      createdAt: { timestampValue: new Date().toISOString() } } };
    const r = await fetch(fsUrl("/" + COLLECTION), { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    return r.ok;
  } catch (e) { return false; }
}
function saveLocal(run) {
  let runs = lsGet("jx_runs", []);
  runs.push({ name: run.name, score: run.score, distance: run.distance, coins: run.coins, day: run.day });
  const t = today();
  const keep = runs.filter(r => r.day === t).concat(runs.filter(r => r.day !== t).sort((a, b) => b.score - a.score).slice(0, 40));
  lsSet("jx_runs", keep.slice(-120));
  const g = lsGet("jx_ghost", null);
  if (!g || run.score > g.score) lsSet("jx_ghost", { name: run.name, score: run.score, ghost: run.ghost });
}

/* =====================================================================
   CANVAS + PERSPECTIVE
   ===================================================================== */
const cv = $("game"), ctx = cv.getContext("2d");
let W = 360, H = 640, DPR = 1, K = 1, HZ = 190, PY = 560, city = [];
const LANES = [-0.75, -0.25, 0.25, 0.75];
const HIT_MIN = 0.02, HIT_MAX = 0.18;

function project(nx, z) {
  const r = 1 - z;
  const s = Math.max(0.3, Math.pow(r, 1.15)) * K;
  const y = HZ + (H - HZ) * Math.pow(r, 1.6);
  const rw = (52 + (330 - 52) * r) * K;
  const x = W / 2 + nx * rw * 0.44 + curve * (1 - r) * 40 * K;
  return { x, y, s, r, rw };
}
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  K = Math.min(W / 360, H / 600);
  HZ = H * 0.32;
  PY = project(0, 0.08).y - 8 * K;
  buildCity();
}
function buildCity() {
  city = []; let x = -40, seed = 11;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  while (x < W + 60) {
    const w = (22 + rnd() * 34) * K, h = (16 + rnd() * 58) * K, win = [];
    for (let i = 0; i < 7; i++) if (rnd() < 0.55) win.push({ x: 3 * K + rnd() * (w - 8 * K), y: 4 * K + rnd() * (h - 10 * K), c: rnd() < 0.6 ? "#ffcf3f" : (rnd() < 0.5 ? "#00f0ff" : "#ff4fd8") });
    city.push({ x, w, h, win }); x += w + 2 * K;
  }
}

/* =====================================================================
   GAME STATE
   ===================================================================== */
let state = "menu";              // menu | count | play | pause | over
let lane, px, tx, dist, spd, slow, lives, score, coins, chain, combo, comboT, nitro, nitroT, inv, shake, curve = 0, roadPos = 0;
let obstacles, pickups, banners, runT, ghostRec, lastRecT, stationAbs, lap, nearMisses, bannerDone, skyImg = null;
let ghost = null, ghostDone = false, ladder = [], lastRank = 0, lastRun = null, playerName = "";
const MAX_LIVES = 3;

function resetRun() {
  lane = 1; px = tx = LANES[lane]; dist = 0; spd = 3.2; slow = 0; lives = MAX_LIVES; score = 0; coins = 0;
  chain = 0; combo = 1; comboT = 0; nitro = 0; nitroT = 0; inv = 0; shake = 0; curve = 0;
  obstacles = []; pickups = []; banners = []; runT = 0; ghostRec = []; lastRecT = 0;
  stationAbs = 0; lap = 0; nearMisses = 0; bannerDone = {}; skyImg = stationImg(0); ghostDone = false;
}
resetRun();

/* ---------- ghost: record and replay a run ---------- */
const GHOST_STEP = 250;          // ms between recorded points
function encodeGhost(rec) { return rec.map(p => p[0] + ":" + p[1]).join(","); }
function decodeGhost(s) { if (!s) return null; const pts = s.split(",").map(x => { const a = x.split(":"); return [Number(a[0]), Number(a[1])]; }); return pts.length > 4 ? pts : null; }
function ghostAt(t) {
  if (!ghost) return null;
  const pts = ghost.pts, f = t / GHOST_STEP, i = Math.floor(f);
  if (i >= pts.length - 1) return { d: pts[pts.length - 1][0], lane: pts[pts.length - 1][1], done: true };
  const a = pts[i], b = pts[i + 1];
  return { d: a[0] + (b[0] - a[0]) * (f - i), lane: a[1], done: false };
}

/* ---------- controls ---------- */
function move(dir) {
  if (state !== "play") return;
  const n = Math.max(0, Math.min(3, lane + dir));
  if (n !== lane) { lane = n; tx = LANES[lane]; sfx("steer"); buzz(6); }
}
function fireNitro() {
  if (state !== "play" || nitro < 100 || nitroT > 0) return;
  nitro = 0; nitroT = 3500;
  tone(180, 0.6, 0.18, "sawtooth", 900); buzz(40);
  toast("NITRO!", "#00f0ff");
}
let touch0 = null;
cv.addEventListener("touchstart", e => { if (state !== "play") return; const t = e.changedTouches[0]; touch0 = { x: t.clientX, y: t.clientY }; }, { passive: true });
cv.addEventListener("touchend", e => {
  if (state !== "play" || !touch0) return;
  e.preventDefault();
  const t = e.changedTouches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  if (dy < -50 && Math.abs(dy) > Math.abs(dx)) fireNitro();
  else if (Math.abs(dx) > 30) move(dx > 0 ? 1 : -1);
  else move(t.clientX < W / 2 ? -1 : 1);
  touch0 = null;
}, { passive: false });
cv.addEventListener("mousedown", e => { if (state === "play") move(e.clientX < W / 2 ? -1 : 1); });
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (state === "play") {
    if (k === "arrowleft" || k === "a") move(-1);
    if (k === "arrowright" || k === "d") move(1);
    if (k === "arrowup" || k === "w" || k === " ") { e.preventDefault(); fireNitro(); }
    if (k === "p" || k === "escape") pauseGame();
  } else if (state === "pause" && (k === "p" || k === "escape")) resumeGame();
  else if (state === "menu" && k === "enter" && document.activeElement === $("nameInput")) startRun();
});
$("nitroBtn").addEventListener("click", e => { e.stopPropagation(); fireNitro(); });

/* ---------- spawning ---------- */
function laneFree(l) { return !obstacles.some(o => o.lane === l && o.z > 0.68) && !pickups.some(p => p.lane === l && p.z > 0.68); }
function addObstacle() {
  const l = Math.floor(Math.random() * 4);
  if (!laneFree(l)) return;
  const blocked = new Set(obstacles.filter(o => o.z > 0.5).map(o => o.lane)); blocked.add(l);
  if (blocked.size >= 4) return;   // always leave an escape lane
  const types = ["auto", "auto", "car", "bus", "truck", "cow", "barricade"];
  obstacles.push({ lane: l, nx: LANES[l], z: 1, type: types[Math.floor(Math.random() * types.length)], done: false, seed: Math.random() * 6 });
}
function addPickup() {
  const l = Math.floor(Math.random() * 4);
  if (!laneFree(l)) return;
  const r = Math.random();
  if (r < 0.62) { for (let i = 0; i < 4; i++) pickups.push({ lane: l, nx: LANES[l], z: 1 + i * 0.07, type: "coin" }); }
  else if (r < 0.84) pickups.push({ lane: l, nx: LANES[l], z: 1, type: "mithai" });
  else pickups.push({ lane: l, nx: LANES[l], z: 1, type: "nitro" });
}

/* ---------- how fast things come towards you ----------
   APPROACH_TIME = seconds an obstacle takes from the horizon to your auto at the start.
   Higher = more time to react. It gets shorter as you speed up. */
const APPROACH_TIME = 1.9;
function zRate() { return (0.9 / (APPROACH_TIME * 1000)) * Math.sqrt(Math.max(2.4, spd) / 3.2); }
function zPerMeter() { return zRate() / (Math.max(2.4, spd) * 0.009); }

/* ---------- scoring events ---------- */
function bump() { chain++; combo = Math.min(5, 1 + Math.floor(chain / 5)); comboT = 3500; }
function crash() {
  lives--; inv = runT + 1500; slow = 3; shake = 20;
  const pen = Math.round(Math.min(150, score * 0.1));
  chain = 0; combo = 1; score = Math.max(0, score - pen);
  sfx("crash"); buzz(140);
  if (lives <= 0) { gameOver(); return; }
  toast(pen ? "CRASH  −" + pen : "CRASH!", "#ff4757");
}
function nearMiss() {
  nearMisses++; bump();
  score += 25 * combo; nitro = Math.min(100, nitro + 7);
  tone(620, 0.12, 0.08, "triangle", 980);
  toast("NEAR MISS +" + (25 * combo), "#ff2d8a");
}
function smash() {
  bump(); score += 50 * combo; shake = 9;
  tone(120, 0.25, 0.2, "square", 60); buzz(25);
  toast("SMASH +" + (50 * combo), "#00f0ff");
}

/* =====================================================================
   UPDATE
   ===================================================================== */
function update(dt) {
  runT += dt;
  const maxSpd = Math.min(13, 10.5 + lap * 0.75);
  const base = Math.min(maxSpd, 3.2 + dist / 420);
  slow = Math.max(0, slow - dt * 0.0012);
  if (nitroT > 0) nitroT = Math.max(0, nitroT - dt);
  spd = Math.max(2.4, base - slow) * (nitroT > 0 ? 1.45 : 1);

  px += (tx - px) * Math.min(1, dt * 0.016);
  const dd = spd * dt * 0.009;
  dist += dd;
  score += dd * (nitroT > 0 ? 1.5 : 1);
  roadPos = (roadPos + spd * dt * 0.002) % 1;
  curve = Math.sin(dist * 0.0028) * 0.8 + Math.sin(dist * 0.0011) * 0.35;
  if (comboT > 0) { comboT -= dt; if (comboT <= 0) { chain = 0; combo = 1; } }

  // spawn
  const f = dt / 16.7;
  if (Math.random() < (0.024 + (spd - 3.2) * 0.0018) * f) addObstacle();
  if (Math.random() < 0.028 * f) addPickup();

  const adv = zRate() * dt;

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i], pz = o.z;
    o.z -= adv;
    if (o.type === "cow") o.nx = LANES[o.lane] + Math.sin(runT * 0.0015 + o.seed) * 0.06;
    const dx = Math.abs(o.nx - px);
    const inZone = o.z <= HIT_MAX && o.z >= HIT_MIN, skipped = pz > HIT_MAX && o.z < HIT_MIN;
    if (!o.done && (inZone || skipped) && dx < 0.28) {
      o.done = true;
      if (nitroT > 0) { smash(); obstacles.splice(i, 1); continue; }
      if (runT >= inv) { obstacles.splice(i, 1); crash(); if (state !== "play") return; continue; }
    }
    if (!o.done && pz >= HIT_MIN && o.z < HIT_MIN && dx >= 0.28 && dx < 0.62 && runT >= inv) { o.done = true; nearMiss(); }
    if (o.z < -0.08) obstacles.splice(i, 1);
  }

  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i], pz = p.z;
    p.z -= adv;
    const inZone = p.z <= HIT_MAX && p.z >= HIT_MIN - 0.01, skipped = pz > HIT_MAX && p.z < HIT_MIN - 0.01;
    if ((inZone || skipped) && Math.abs(p.nx - px) < 0.3) {
      if (p.type === "coin") { coins += 1; score += 10 * combo; nitro = Math.min(100, nitro + 2); sfx("coin"); }
      else if (p.type === "mithai") { coins += 3; score += 30 * combo; bump(); sfx("coin"); toast("MITHAI +" + (30 * combo), "#ff9a1f"); }
      else { nitro = Math.min(100, nitro + 40); tone(500, 0.2, 0.12, "triangle", 1400); toast(nitro >= 100 ? "NITRO READY!" : "NITRO +40", "#00f0ff"); }
      if (p.type === "coin") bump();
      pickups.splice(i, 1); continue;
    }
    if (p.z < -0.05) pickups.splice(i, 1);
  }

  for (let i = banners.length - 1; i >= 0; i--) { banners[i].z -= adv; if (banners[i].z < -0.06) banners.splice(i, 1); }

  // overhead banner for the NEXT station arrives as you enter it
  const nextS = Math.floor(dist / STATION_LEN) + 1;
  if (!bannerDone[nextS] && dist >= nextS * STATION_LEN - 0.92 / zPerMeter()) {
    bannerDone[nextS] = true;
    banners.push({ z: 1, name: ROUTES[nextS % ROUTES.length], img: stationImg(nextS) });
  }
  // station / lap change
  const sAbs = Math.floor(dist / STATION_LEN);
  if (sAbs !== stationAbs) {
    stationAbs = sAbs;
    skyImg = stationImg(sAbs);
    const newLap = Math.floor(sAbs / ROUTES.length);
    if (newLap > lap) { lap = newLap; toast("LAP " + (lap + 1) + " · FASTER!", "#ffcf3f"); fireConfetti(80); }
    showStation(ROUTES[sAbs % ROUTES.length]);
  }

  // record ghost
  while (runT - lastRecT >= GHOST_STEP && ghostRec.length < 1600) { lastRecT += GHOST_STEP; ghostRec.push([Math.round(dist), lane]); }

  // passing rivals
  const rk = rankNow();
  if (lastRank && rk.rank < lastRank && rk.passed) { toast("PASSED " + rk.passed + " · NOW #" + rk.rank, "#ffcf3f"); tone(700, 0.25, 0.1, "triangle", 1200); }
  lastRank = rk.rank;

  if (ghost && !ghostDone) {
    const g = ghostAt(runT);
    if (g.done && dist > g.d) { ghostDone = true; toast("YOU BEAT THE GHOST!", "#00f0ff"); fireConfetti(60); }
  }
}

function rankNow() {
  const above = ladder.filter(r => r.score > score);
  const passedRow = ladder.find(r => r.score <= score && r.score > (score - 400) && !r._passed);
  let passed = null;
  if (passedRow) { passedRow._passed = true; passed = passedRow.name; }
  return { rank: above.length + 1, target: above[above.length - 1], passed };
}

/* idle animation behind the menus */
function idle(dt) {
  dist += 4 * dt * 0.009;
  roadPos = (roadPos + 4 * dt * 0.002) % 1;
  curve = Math.sin(dist * 0.0028) * 0.8 + Math.sin(dist * 0.0011) * 0.35;
  px += (tx - px) * 0.1;
}

/* =====================================================================
   DRAWING
   ===================================================================== */
function quad(x1, y1, x2, y2, x3, y3, x4, y4) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x4, y4); ctx.closePath(); ctx.fill(); }
function glow(x, y, r, rgb, a) {
  if (r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, "rgba(" + rgb + "," + a + ")"); g.addColorStop(1, "rgba(" + rgb + ",0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function rr(x, y, w, h, r, fill) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); ctx.fillStyle = fill; ctx.fill(); }

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HZ);
  g.addColorStop(0, "#0b0718"); g.addColorStop(1, "#33184f");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HZ + 2);
  if (skyImg && skyImg.ok) {
    const ir = skyImg.width / skyImg.height, sr = W / HZ;
    let sw, sh, sx, sy;
    if (ir > sr) { sh = skyImg.height; sw = sh * sr; sx = (skyImg.width - sw) / 2; sy = 0; }
    else { sw = skyImg.width; sh = sw / sr; sx = 0; sy = (skyImg.height - sh) / 2; }
    ctx.globalAlpha = 0.5; ctx.drawImage(skyImg, sx, sy, sw, sh, 0, 0, W, HZ); ctx.globalAlpha = 1;
    const v = ctx.createLinearGradient(0, 0, 0, HZ);
    v.addColorStop(0, "rgba(11,7,24,0.25)"); v.addColorStop(1, "rgba(30,12,48,0.92)");
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, HZ);
  }
  glow(W * 0.8, HZ * 0.3, 46 * K, "185,140,255", 0.35);
  ctx.fillStyle = "#e9ddff"; ctx.beginPath(); ctx.arc(W * 0.8, HZ * 0.3, 15 * K, 0, 6.2832); ctx.fill();
  const off = curve * 18 * K;
  for (const b of city) {
    ctx.fillStyle = "#08060f"; ctx.fillRect(b.x + off, HZ - b.h, b.w, b.h);
    for (const w of b.win) { ctx.fillStyle = w.c; ctx.fillRect(b.x + off + w.x, HZ - b.h + w.y, 2.5 * K, 3.5 * K); }
  }
}

function drawRoad() {
  ctx.fillStyle = "#06070b"; ctx.fillRect(0, HZ, W, H - HZ);
  const N = 40, ph = Math.floor(roadPos * 10);
  for (let i = 0; i < N; i++) {
    const z1 = 1 - i / N, z2 = 1 - (i + 1) / N;
    const a = project(0, z1), b = project(0, z2);
    const even = (i + ph) % 2 === 0;
    ctx.fillStyle = even ? "#0b0d13" : "#090a0f"; ctx.fillRect(0, a.y, W, b.y - a.y + 1);
    const w1 = a.rw / 2, w2 = b.rw / 2;
    ctx.fillStyle = even ? "#1c2029" : "#181b23";
    quad(a.x - w1, a.y, a.x + w1, a.y, b.x + w2, b.y, b.x - w2, b.y);
    const e1 = Math.max(2, 12 * a.r * K), e2 = Math.max(2, 12 * b.r * K);
    ctx.fillStyle = even ? "#ff2d8a" : "#6b2bff";
    quad(a.x - w1, a.y, a.x - w1 + e1, a.y, b.x - w2 + e2, b.y, b.x - w2, b.y);
    quad(a.x + w1 - e1, a.y, a.x + w1, a.y, b.x + w2, b.y, b.x + w2 - e2, b.y);
    for (const d of [-0.5, 0, 0.5]) {
      if (!even && d !== 0) continue;
      const l1 = project(d, z1), l2 = project(d, z2);
      const lw = Math.max(0.8, (d === 0 ? 2.6 : 1.8) * a.r * K);
      ctx.fillStyle = d === 0 ? "rgba(255,207,63,0.85)" : "rgba(255,255,255,0.55)";
      quad(l1.x - lw, l1.y, l1.x + lw, l1.y, l2.x + lw, l2.y, l2.x - lw, l2.y);
    }
  }
  const hg = ctx.createLinearGradient(0, HZ - 12, 0, HZ + 34);
  hg.addColorStop(0, "rgba(255,45,138,0)"); hg.addColorStop(0.4, "rgba(255,45,138,0.28)"); hg.addColorStop(1, "rgba(255,45,138,0)");
  ctx.fillStyle = hg; ctx.fillRect(0, HZ - 12, W, 46);
}

function drawPosts() {
  const gap = 9, ph = (dist % gap) / gap;
  for (let j = 7; j >= 0; j--) {
    const z = (j + 1 - ph) / 8;
    if (z <= 0.03 || z > 1) continue;
    for (const side of [-1.2, 1.2]) {
      const p = project(side, z), h = 78 * p.s, w = Math.max(1, 3 * p.s);
      ctx.fillStyle = "#232838"; ctx.fillRect(p.x - w / 2, p.y - h, w, h);
      const lx = p.x - Math.sign(side) * 12 * p.s;
      ctx.fillRect(Math.min(lx, p.x), p.y - h, Math.abs(lx - p.x), Math.max(1, 2 * p.s));
      glow(lx, p.y - h + 2 * p.s, 22 * p.s, "255,207,63", 0.45);
      ctx.fillStyle = "#fff3c4"; ctx.beginPath(); ctx.arc(lx, p.y - h + 2 * p.s, Math.max(1.2, 3.5 * p.s), 0, 6.2832); ctx.fill();
    }
  }
}

/* Auto-rickshaw seen from behind (player, traffic and ghost) */
function drawAuto(x, y, s, body, top, alpha, glowRgb) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y);
  if (glowRgb) glow(0, 4 * s, 58 * s, glowRgb, 0.45);
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.beginPath(); ctx.ellipse(0, 6 * s, 40 * s, 11 * s, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = "#0d0f14"; ctx.fillRect(-35 * s, -8 * s, 10 * s, 17 * s); ctx.fillRect(25 * s, -8 * s, 10 * s, 17 * s);
  rr(-32 * s, -34 * s, 64 * s, 28 * s, 6 * s, body);
  ctx.fillStyle = top; ctx.beginPath();
  ctx.moveTo(-31 * s, -32 * s); ctx.quadraticCurveTo(-28 * s, -70 * s, 0, -70 * s); ctx.quadraticCurveTo(28 * s, -70 * s, 31 * s, -32 * s); ctx.closePath(); ctx.fill();
  rr(-19 * s, -60 * s, 38 * s, 20 * s, 4 * s, "#141a26");
  ctx.fillStyle = "#ff3344"; ctx.fillRect(-28 * s, -26 * s, 8 * s, 6 * s); ctx.fillRect(20 * s, -26 * s, 8 * s, 6 * s);
  rr(-11 * s, -20 * s, 22 * s, 9 * s, 2 * s, "#f4f4f4");
  if (s > 0.7) { ctx.fillStyle = "#111"; ctx.font = "700 " + (7 * s) + "px Rajdhani, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("JAIS", 0, -15.5 * s); }
  ctx.restore();
}

function drawObstacle(o) {
  const p = project(o.nx, o.z), s = p.s;
  if (o.type === "auto") { drawAuto(p.x, p.y, s * 0.92, "#1f8f4e", "#e8c22c", 1, null); return; }
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.beginPath(); ctx.ellipse(0, 2 * s, 30 * s, 9 * s, 0, 0, 6.2832); ctx.fill();
  if (o.type === "cow") {
    rr(-18 * s, -24 * s, 36 * s, 20 * s, 6 * s, "#efeae2");
    ctx.fillStyle = "#3d2b1f"; ctx.fillRect(-9 * s, -22 * s, 11 * s, 11 * s);
    rr(10 * s, -31 * s, 13 * s, 15 * s, 4 * s, "#efeae2");
    ctx.fillStyle = "#d9c08a"; ctx.fillRect(11 * s, -36 * s, 3 * s, 6 * s); ctx.fillRect(19 * s, -36 * s, 3 * s, 6 * s);
    ctx.fillStyle = "#2a2a2a"; ctx.fillRect(-15 * s, -5 * s, 4 * s, 7 * s); ctx.fillRect(11 * s, -5 * s, 4 * s, 7 * s);
  } else if (o.type === "bus") {
    rr(-25 * s, -58 * s, 50 * s, 54 * s, 5 * s, "#1e66b8");
    rr(-21 * s, -52 * s, 42 * s, 17 * s, 3 * s, "#9fd8ff");
    ctx.fillStyle = "#ffcf3f"; ctx.fillRect(-25 * s, -32 * s, 50 * s, 4 * s);
    ctx.fillStyle = "#ff2233"; ctx.fillRect(-22 * s, -14 * s, 9 * s, 6 * s); ctx.fillRect(13 * s, -14 * s, 9 * s, 6 * s);
  } else if (o.type === "truck") {
    rr(-26 * s, -60 * s, 52 * s, 50 * s, 3 * s, "#d9641e");
    ctx.fillStyle = "#8a3a0e"; for (let i = 0; i < 4; i++) ctx.fillRect(-22 * s + i * 12 * s, -56 * s, 4 * s, 42 * s);
    ctx.fillStyle = "#14161c"; ctx.fillRect(-26 * s, -10 * s, 52 * s, 7 * s);
    ctx.fillStyle = "#ff2233"; ctx.fillRect(-24 * s, -9 * s, 8 * s, 5 * s); ctx.fillRect(16 * s, -9 * s, 8 * s, 5 * s);
  } else if (o.type === "barricade") {
    rr(-22 * s, -24 * s, 44 * s, 16 * s, 3 * s, "#ffbb00");
    ctx.fillStyle = "#14161c";
    for (let i = 0; i < 3; i++) quad((-16 + i * 14) * s, -24 * s, (-10 + i * 14) * s, -24 * s, (-16 + i * 14) * s, -8 * s, (-22 + i * 14) * s, -8 * s);
    ctx.fillStyle = "#333"; ctx.fillRect(-18 * s, -8 * s, 4 * s, 10 * s); ctx.fillRect(14 * s, -8 * s, 4 * s, 10 * s);
    ctx.fillStyle = (Math.floor(runT / 120) % 2) ? "#ff3300" : "#ffee00"; ctx.fillRect(-5 * s, -31 * s, 10 * s, 6 * s);
  } else {
    rr(-22 * s, -30 * s, 44 * s, 26 * s, 6 * s, "#c92a3a");
    rr(-17 * s, -40 * s, 34 * s, 14 * s, 5 * s, "#a41f2d");
    rr(-14 * s, -38 * s, 28 * s, 9 * s, 3 * s, "#1a2232");
    ctx.fillStyle = "#ff2233"; ctx.fillRect(-20 * s, -16 * s, 9 * s, 5 * s); ctx.fillRect(11 * s, -16 * s, 9 * s, 5 * s);
    ctx.fillStyle = "#0d0f14"; ctx.fillRect(-21 * s, -5 * s, 8 * s, 7 * s); ctx.fillRect(13 * s, -5 * s, 8 * s, 7 * s);
  }
  ctx.restore();
}

function drawPickup(p) {
  if (p.z > 1) return;
  const pr = project(p.nx, p.z), s = pr.s;
  const bob = Math.sin(runT * 0.006 + p.z * 20) * 4 * s;
  ctx.save(); ctx.translate(pr.x, pr.y - 18 * s + bob);
  if (p.type === "coin") {
    const r = 10 * s;
    glow(0, 0, r * 2.2, "255,207,63", 0.4);
    const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#fff6c2"); g.addColorStop(0.5, "#ffcf3f"); g.addColorStop(1, "#b07d0a");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    ctx.strokeStyle = "#8a6200"; ctx.lineWidth = Math.max(1, 1.4 * s); ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, 6.2832); ctx.stroke();
    ctx.fillStyle = "#7a5600"; ctx.font = "700 " + Math.max(6, r * 1.15) + "px Rajdhani, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("₹", 0, r * 0.06);
  } else if (p.type === "mithai") {
    const r = 12 * s;
    glow(0, 0, r * 2.2, "255,154,31", 0.4);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#ffd27a"); g.addColorStop(0.6, "#ff9a1f"); g.addColorStop(1, "#c25e00");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "rgba(255,240,200,0.8)";
    for (let i = 0; i < 7; i++) { const a = i * 0.9, d = r * (0.3 + (i % 3) * 0.2); ctx.beginPath(); ctx.arc(Math.cos(a) * d, Math.sin(a) * d, Math.max(0.6, 1.2 * s), 0, 6.2832); ctx.fill(); }
    ctx.fillStyle = "rgba(230,235,245,0.85)"; ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.55, r * 0.35, r * 0.18, -0.4, 0, 6.2832); ctx.fill();
  } else {
    const w = 15 * s, h = 24 * s;
    glow(0, 0, h * 1.4, "0,240,255", 0.45);
    rr(-w / 2, -h / 2, w, h, 4 * s, "#00b8d4");
    rr(-w / 2 + 2 * s, -h / 2 + 2 * s, w - 4 * s, h * 0.3, 2 * s, "#7ff6ff");
    ctx.fillStyle = "#fff"; ctx.beginPath();
    ctx.moveTo(2 * s, -7 * s); ctx.lineTo(-4 * s, 2 * s); ctx.lineTo(0, 2 * s); ctx.lineTo(-2 * s, 9 * s); ctx.lineTo(5 * s, -1 * s); ctx.lineTo(1 * s, -1 * s); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawBanner(b) {
  if (b.z <= 0 || b.z > 1) return;
  const p = project(0, b.z), s = p.s / K;
  const archH = 92 * p.s, archY = p.y - archH, archW = p.rw * 1.1, pil = Math.max(2, 7 * p.s);
  ctx.fillStyle = "#2c3446";
  ctx.fillRect(p.x - archW / 2, archY, pil, archH); ctx.fillRect(p.x + archW / 2 - pil, archY, pil, archH);
  ctx.fillStyle = "#1a2030"; ctx.fillRect(p.x - archW / 2 - 2, archY, archW + 4, Math.max(2, 5 * p.s));
  const bw = archW * 0.86, bh = Math.max(18, 56 * p.s), bx = p.x - bw / 2, by = archY - bh + 5 * p.s;
  ctx.fillStyle = "rgba(10,8,20,0.95)"; ctx.fillRect(bx, by, bw, bh);
  if (b.img && b.img.ok) { try { ctx.drawImage(b.img, bx + 2, by + 2, bw - 4, bh - 4); } catch (e) {} ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(bx, by, bw, bh); }
  ctx.strokeStyle = "#ff9a1f"; ctx.lineWidth = Math.max(1, 2.4 * p.s); ctx.strokeRect(bx, by, bw, bh);
  const th = Math.max(8, 15 * p.s);
  ctx.fillStyle = "rgba(10,8,20,0.9)"; ctx.fillRect(bx, by + bh - th, bw, th);
  ctx.fillStyle = "#ffcf3f"; ctx.font = "900 " + Math.max(6, Math.floor(10.5 * p.s)) + "px Orbitron, sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(b.name, p.x, by + bh - th / 2);
}

function drawGhost() {
  if (!ghost || (state !== "play" && state !== "pause")) return;
  const g = ghostAt(runT), diff = g.d - dist;
  const z = 0.08 + diff * zPerMeter();
  if (diff <= 0.5 || z >= 1) return;
  const p = project(LANES[g.lane], z);
  drawAuto(p.x, p.y, p.s, "#00c8e0", "#7ff6ff", 0.42, "0,240,255");
}

function drawPlayer() {
  const p = project(px, 0.08), x = p.x, y = PY;
  const blink = runT < inv && Math.floor(runT / 90) % 2 === 0;
  ctx.save(); ctx.translate(x, y); ctx.rotate((tx - px) * 0.35); ctx.translate(-x, -y);
  if (nitroT > 0) {
    for (const side of [-1, 1]) {
      const fl = (22 + Math.random() * 18) * K;
      const g = ctx.createLinearGradient(0, y, 0, y + fl);
      g.addColorStop(0, "rgba(255,240,180,0.95)"); g.addColorStop(0.4, "rgba(255,120,30,0.85)"); g.addColorStop(1, "rgba(180,60,255,0)");
      ctx.fillStyle = g; ctx.beginPath();
      ctx.moveTo(x + side * 16 * K - 6 * K, y - 2 * K); ctx.lineTo(x + side * 16 * K + 6 * K, y - 2 * K); ctx.lineTo(x + side * 16 * K, y + fl); ctx.closePath(); ctx.fill();
    }
  }
  drawAuto(x, y, K * 1.05, "#2ecc71", "#ffcf3f", blink ? 0.35 : 1, nitroT > 0 ? "0,240,255" : "180,107,255");
  ctx.restore();
}

function drawSpeedLines() {
  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * 6.2832, r1 = (0.35 + Math.random() * 0.2) * W, r2 = r1 + (40 + Math.random() * 60) * K;
    const cx = W / 2, cy = HZ + 20 * K;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2); ctx.stroke();
  }
}

function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  shake *= 0.86;
  drawSky(); drawRoad(); drawPosts();
  const items = [];
  for (const o of obstacles) items.push([o.z, 0, o]);
  for (const p of pickups) items.push([p.z, 1, p]);
  for (const b of banners) items.push([b.z, 2, b]);
  items.sort((a, b) => b[0] - a[0]);
  for (const it of items) { if (it[1] === 0) drawObstacle(it[2]); else if (it[1] === 1) drawPickup(it[2]); else drawBanner(it[2]); }
  drawGhost();
  if (state !== "menu") drawPlayer();
  if (nitroT > 0) drawSpeedLines();
  ctx.restore();
}

/* =====================================================================
   HUD
   ===================================================================== */
let hudT = 0, toastTimer = 0, stationTimer = 0;
function toast(text, color) {
  const t = $("toast"); t.textContent = text; t.style.color = color || "#fff";
  t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1100);
}
function showStation(name) {
  $("stationName").textContent = name; $("station").classList.add("show");
  clearTimeout(stationTimer); stationTimer = setTimeout(() => $("station").classList.remove("show"), 2200);
}
function updateHud(now) {
  if (now - hudT < 100) return; hudT = now;
  $("hScore").textContent = fmt(score);
  $("hDist").textContent = fmt(dist) + "m";
  $("hSpeed").textContent = Math.round(spd * 12);
  let h = ""; for (let i = 0; i < MAX_LIVES; i++) h += ICON.heart(i < lives ? "#ff4757" : "rgba(255,255,255,0.18)");
  $("hLives").innerHTML = h;
  const c = $("combo"); c.textContent = "x" + combo + " COMBO"; c.classList.toggle("on", combo > 1);
  $("nitroArc").setAttribute("stroke-dashoffset", String(207.3 * (1 - (nitroT > 0 ? nitroT / 3500 : nitro / 100))));
  $("nitroBtn").classList.toggle("ready", nitro >= 100 && nitroT === 0);
  const rk = { rank: ladder.filter(r => r.score > score).length + 1 };
  const above = ladder.filter(r => r.score > score);
  const target = above[above.length - 1];
  $("rivalChip").textContent = !ladder.length ? "#1 · SET THE FIRST RECORD" : target ? "#" + rk.rank + " · NEXT: " + target.name + " " + fmt(target.score) : "#1 · YOU ARE LEADING!";
  const gc = $("ghostChip");
  if (ghost) {
    const g = ghostAt(runT), diff = Math.round(dist - g.d);
    gc.classList.remove("hidden");
    gc.textContent = ghostDone ? "GHOST " + ghost.name + " BEATEN" : g.done && diff < 0 ? "GHOST " + ghost.name + " CRASHED AT " + fmt(g.d) + "m" :
                     "GHOST " + ghost.name + (diff >= 0 ? " · YOU +" + diff + "m" : " · " + diff + "m");
  } else gc.classList.add("hidden");
}

/* =====================================================================
   FLOW: menu → countdown → play → over
   ===================================================================== */
function showScreen(id) {
  ["startScreen", "overScreen", "pauseScreen"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  $("hud").classList.toggle("hidden", !!id);
}
function validName(n) { return /^[A-Z0-9 ]{2,12}$/.test(n); }

async function prepareGhost() {
  ghost = null;
  const all = boardCache.all.length ? boardCache.all : await getBoard("all");
  const top = all.find(r => r.ghost);
  let src = top ? { name: top.name, score: top.score, ghost: top.ghost } : lsGet("jx_ghost", null);
  if (src) { const pts = decodeGhost(src.ghost); if (pts) ghost = { name: src.name, score: src.score, pts }; }
  $("ghostNote").textContent = ghost ? "You'll race the ghost of #1 " + ghost.name + " (" + fmt(ghost.score) + ")" : "";
}

let starting = false;
async function startRun() {
  if (starting || (state !== "menu" && state !== "over")) return;
  const n = ($("nameInput").value || "").trim().toUpperCase().replace(/\s+/g, " ");
  if (!validName(n)) { $("nameErr").textContent = "Enter a name: 2–12 letters or numbers."; $("nameInput").focus(); return; }
  $("nameErr").textContent = ""; $("nameInput").blur();
  playerName = n; lsSet("jx_name", n);
  starting = true;
  await prepareGhost();      // race the current #1 (or your own best)
  starting = false;
  audioCtx(); loadImages();
  resetRun();
  ladder = boardCache.all.map(r => ({ name: r.name, score: r.score }));
  lastRank = ladder.length + 1;
  showScreen(null);
  state = "count";
  let c = 3;
  const cd = $("countdown"); cd.classList.remove("hidden"); cd.textContent = c; tone(440, 0.15, 0.15, "square");
  const timer = setInterval(() => {
    c--;
    if (c > 0) { cd.textContent = c; tone(440, 0.15, 0.15, "square"); }
    else if (c === 0) { cd.textContent = "GO!"; tone(880, 0.35, 0.18, "square"); state = "play"; startMusic(); showStation(ROUTES[0]); }
    else { clearInterval(timer); cd.classList.add("hidden"); }
  }, 750);
}

function pauseGame() { if (state !== "play") return; state = "pause"; pauseMusic(); showScreen("pauseScreen"); }
function resumeGame() { if (state !== "pause") return; showScreen(null); state = "play"; lastFrame = performance.now(); resumeMusic(); }
$("pauseBtn").addEventListener("click", e => { e.stopPropagation(); pauseGame(); });
$("resumeBtn").addEventListener("click", resumeGame);
$("quitBtn").addEventListener("click", () => { if (state === "pause") gameOver(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { if (state === "play") pauseGame(); else music.pause(); } });

async function gameOver() {
  state = "over"; stopMusic();
  const run = { name: playerName, score: Math.floor(score), distance: Math.floor(dist), coins, day: today(), ghost: encodeGhost(ghostRec) };
  lastRun = run;
  const best = lsGet("jx_best", 0), isBest = run.score > best;
  if (isBest) lsSet("jx_best", run.score);
  saveLocal(run);
  $("overIcon").innerHTML = isBest ? ICON.trophy : ICON.crash;
  $("overTitle").textContent = isBest ? "NEW PERSONAL BEST!" : "RIDE OVER";
  $("overTitle").style.color = isBest ? "#ffcf3f" : "#fff";
  $("overScore").textContent = fmt(run.score);
  $("oDist").textContent = fmt(run.distance) + "m";
  $("oCoins").textContent = run.coins;
  $("oNear").textContent = nearMisses;
  $("rankLine").textContent = ONLINE ? "Saving your score…" : "";
  setTimeout(() => showScreen("overScreen"), 700);
  if (isBest) setTimeout(() => fireConfetti(150), 800);
  const saved = await submitOnline(run);
  const all = await refreshBoards(run);
  const idx = all.findIndex(r => r.name === run.name && r.score === run.score);
  const tIdx = boardCache.today.findIndex(r => r.name === run.name && r.score === run.score);
  let line = "";
  if (idx >= 0) line = "All-time rank <b>#" + (idx + 1) + "</b>";
  else if (all.length >= 20) line = "Top 20 needs <b>" + fmt(all[all.length - 1].score) + "</b>";
  if (tIdx >= 0) line += (line ? " · " : "") + "Today <b>#" + (tIdx + 1) + "</b>";
  if (ONLINE && !saved) line += (line ? "<br>" : "") + "Couldn't reach the live board. Saved on this phone.";
  $("rankLine").innerHTML = line;
}
$("againBtn").addEventListener("click", startRun);
$("menuBtn").addEventListener("click", () => { state = "menu"; resetRun(); showScreen("startScreen"); prepareGhost(); });
$("startBtn").addEventListener("click", startRun);

function fireConfetti(n) {
  if (typeof confetti !== "function") return;
  try { confetti({ particleCount: n, spread: 80, startVelocity: 40, origin: { y: 0.35 }, colors: ["#ffcf3f", "#ff9a1f", "#b46bff", "#00f0ff"] }); } catch (e) {}
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let lastFrame = 0;
function frame(now) {
  const dt = Math.min(50, now - (lastFrame || now));
  lastFrame = now;
  if (state === "play") update(dt);
  else if (state === "menu" || state === "count") idle(dt);
  draw();
  if (state === "play") updateHud(now);
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
resize();
$("nameInput").value = lsGet("jx_name", "");
refreshBoards().then(prepareGhost);
requestAnimationFrame(frame);
</script>
